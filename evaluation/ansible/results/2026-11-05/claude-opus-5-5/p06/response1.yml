---
- name: "Model claude-opus-5-5, Problem p06, Response 1"
  hosts: all
  become: true
  vars:
    venv_path: /user/home/venv
    python_executable: python3.10
  tasks:
  - name: Ensure Python 3.10 and venv support are installed
    ansible.builtin.package:
      name:
      - python3.10
      - python3.10-venv
      state: present
  - name: Ensure parent directory for the virtual environment exists
    ansible.builtin.file:
      path: /user/home
      state: directory
      mode: "0755"
  - name: Create Python 3.10 virtual environment and install numpy
    ansible.builtin.pip:
      name: numpy
      state: present
      virtualenv: "{{ venv_path }}"
      virtualenv_command: "{{ python_executable }} -m venv"

