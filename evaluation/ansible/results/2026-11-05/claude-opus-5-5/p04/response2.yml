---
- name: "Model claude-opus-5-5, Problem p04, Response 2"
  hosts: all
  become: true
  tasks:
  - name: Ensure /srv/path exists
    ansible.builtin.stat:
      path: /srv/path
    register: srv_path
  - name: Fail if /srv/path does not exist
    ansible.builtin.fail:
      msg: "/srv/path does not exist"
    when: not srv_path.stat.exists
  - name: Set the top-level directory to 0755
    ansible.builtin.file:
      path: /srv/path
      state: directory
      mode: "0755"
  - name: Find all directories under /srv/path
    ansible.builtin.find:
      paths: /srv/path
      file_type: directory
      recurse: true
      hidden: true
    register: found_dirs
  - name: Set directories to 0755 (owner rwx, others r-x)
    ansible.builtin.file:
      path: "{{ item.path }}"
      state: directory
      mode: "0755"
    loop: "{{ found_dirs.files }}"
    loop_control:
      label: "{{ item.path }}"
  - name: Find all files under /srv/path
    ansible.builtin.find:
      paths: /srv/path
      file_type: file
      recurse: true
      hidden: true
    register: found_files
  - name: Set files to 0644 (owner rw, others r)
    ansible.builtin.file:
      path: "{{ item.path }}"
      state: file
      mode: "0644"
    loop: "{{ found_files.files }}"
    loop_control:
      label: "{{ item.path }}"

