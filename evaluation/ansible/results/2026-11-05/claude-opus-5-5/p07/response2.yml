---
- name: "Model claude-opus-5-5, Problem p07, Response 2"
  hosts: all
  become: true
  tasks:
  - name: Ensure git is installed
    ansible.builtin.package:
      name: git
      state: present
  - name: Clone the release1.8.4 branch from GitHub over HTTPS to /ansible
    ansible.builtin.git:
      repo: https://github.com/ansible/ansible.git
      dest: /ansible
      version: release1.8.4
      clone: true
      update: true

