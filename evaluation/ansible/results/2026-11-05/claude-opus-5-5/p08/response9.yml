---
- name: "Model claude-opus-5-5, Problem p08, Response 9"
  hosts: all
  become: true
  tasks:
  - name: Update apt cache on Debian based systems
    ansible.builtin.apt:
      update_cache: true
      cache_valid_time: 3600
    when: ansible_facts['os_family'] == "Debian"
  - name: Install numpy on Debian based systems
    ansible.builtin.apt:
      name: python3-numpy
      state: present
    when: ansible_facts['os_family'] == "Debian"
  - name: Install EPEL repository on RedHat based systems (needed on some releases)
    ansible.builtin.package:
      name: epel-release
      state: present
    when:
    - ansible_facts['os_family'] == "RedHat"
    - ansible_facts['distribution'] != "Fedora"
    ignore_errors: true
  - name: Install numpy on RedHat based systems
    ansible.builtin.package:
      name: python3-numpy
      state: present
    when: ansible_facts['os_family'] == "RedHat"

