---
- name: "Model claude-opus-5-5, Problem p16, Response 1"
  hosts: all
  become: true
  vars:
    target_user: dev
    zsh_path: /bin/zsh
  tasks:
  - name: Install zsh
    ansible.builtin.package:
      name: zsh
      state: present
  - name: Set zsh as the default shell for the user
    ansible.builtin.user:
      name: "{{ target_user }}"
      shell: "{{ zsh_path }}"
  - name: Gather user account information
    ansible.builtin.getent:
      database: passwd
      key: "{{ target_user }}"
  - name: Set the user's home directory fact
    ansible.builtin.set_fact:
      target_user_home: "{{ getent_passwd[target_user][4] }}"
  - name: Ensure the user's .zshrc file exists
    ansible.builtin.file:
      path: "{{ target_user_home }}/.zshrc"
      state: touch
      owner: "{{ target_user }}"
      mode: "0644"
      access_time: preserve
      modification_time: preserve

