---
- name: "Model claude-opus-5-5, Problem p15, Response 5"
  hosts: all
  become: true
  vars:
    target_dir: /home/mydata/web
  tasks:
  - name: Find all files and directories inside the target directory
    ansible.builtin.find:
      paths: "{{ target_dir }}"
      file_type: any
      hidden: true
      recurse: false
    register: web_contents
  - name: Remove each file and directory found inside the target directory
    ansible.builtin.file:
      path: "{{ item.path }}"
      state: absent
    loop: "{{ web_contents.files }}"
    loop_control:
      label: "{{ item.path }}"

