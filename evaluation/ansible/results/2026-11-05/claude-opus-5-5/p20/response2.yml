---
- name: "Model claude-opus-5-5, Problem p20, Response 2"
  hosts: redhat,debian
  become: true
  vars:
    ssh_packages:
      Debian:
      - openssh-client
      - openssh-server
      RedHat:
      - openssh-clients
      - openssh-server
    ssh_service:
      Debian: ssh
      RedHat: sshd
  tasks:
  - name: Fail if OS family is not supported
    ansible.builtin.fail:
      msg: "Unsupported OS family: {{ ansible_facts['os_family'] }}"
    when: ansible_facts['os_family'] not in ['Debian', 'RedHat']
  - name: Update apt cache (Debian)
    ansible.builtin.apt:
      update_cache: true
      cache_valid_time: 3600
    when: ansible_facts['os_family'] == 'Debian'
  - name: Install SSH client and server packages
    ansible.builtin.package:
      name: "{{ ssh_packages[ansible_facts['os_family']] }}"
      state: present
  - name: Ensure SSH server is started and enabled
    ansible.builtin.service:
      name: "{{ ssh_service[ansible_facts['os_family']] }}"
      state: started
      enabled: true
  - name: Ensure user fizbaz exists
    ansible.builtin.user:
      name: fizbaz
      state: present
      create_home: true
      shell: /bin/bash
  - name: Ensure /.ssh directory exists
    ansible.builtin.file:
      path: /.ssh
      state: directory
      owner: fizbaz
      group: fizbaz
      mode: "0700"
  - name: Generate SSH key for fizbaz at /.ssh/fizbaz_rsa
    ansible.builtin.user:
      name: fizbaz
      generate_ssh_key: true
      ssh_key_type: rsa
      ssh_key_bits: 4096
      ssh_key_file: /.ssh/fizbaz_rsa
      ssh_key_comment: "fizbaz@{{ ansible_facts['hostname'] }}"
  - name: Ensure correct permissions on private key
    ansible.builtin.file:
      path: /.ssh/fizbaz_rsa
      owner: fizbaz
      group: fizbaz
      mode: "0600"
  - name: Ensure correct permissions on public key
    ansible.builtin.file:
      path: /.ssh/fizbaz_rsa.pub
      owner: fizbaz
      group: fizbaz
      mode: "0644"

