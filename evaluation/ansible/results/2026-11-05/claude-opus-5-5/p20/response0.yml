---
- name: "Model claude-opus-5-5, Problem p20, Response 10"
  hosts: redhat,debian
  become: true
  vars:
    ssh_packages:
      Debian:
      - openssh-client
      - openssh-server
      RedHat:
      - openssh-clients
      - openssh-server
    ssh_service:
      Debian: ssh
      RedHat: sshd
  tasks:
  - name: Fail on unsupported OS family
    ansible.builtin.fail:
      msg: "Unsupported OS family: {{ ansible_facts['os_family'] }}"
    when: ansible_facts['os_family'] not in ['Debian', 'RedHat']
  - name: Update apt cache (Debian)
    ansible.builtin.apt:
      update_cache: true
      cache_valid_time: 3600
    when: ansible_facts['os_family'] == 'Debian'
  - name: Install SSH client and server
    ansible.builtin.package:
      name: "{{ ssh_packages[ansible_facts['os_family']] }}"
      state: present
  - name: Start and enable SSH server
    ansible.builtin.service:
      name: "{{ ssh_service[ansible_facts['os_family']] }}"
      state: started
      enabled: true
  - name: Ensure user fizbaz exists
    ansible.builtin.user:
      name: fizbaz
      state: present
      create_home: true
  - name: Ensure /.ssh directory exists
    ansible.builtin.file:
      path: /.ssh
      state: directory
      owner: fizbaz
      group: fizbaz
      mode: "0700"
  - name: Generate SSH key for fizbaz at /.ssh/fizbaz_rsa
    community.crypto.openssh_keypair:
      path: /.ssh/fizbaz_rsa
      type: rsa
      size: 4096
      owner: fizbaz
      group: fizbaz
      mode: "0600"
      comment: "fizbaz@{{ ansible_facts['hostname'] }}"
      state: present

