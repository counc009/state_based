---
- name: "Model claude-opus-5-5, Problem p09, Response 4"
  hosts: all
  become: true
  tasks:
  - name: Append 'module load gcc' to the end of foo's .bashrc
    ansible.builtin.lineinfile:
      path: /home/foo/.bashrc
      line: module load gcc
      insertafter: EOF
      create: true
      owner: foo
      group: foo
      mode: "0644"

