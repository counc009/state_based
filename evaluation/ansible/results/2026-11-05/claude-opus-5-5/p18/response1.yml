---
- name: "Model claude-opus-5-5, Problem p18, Response 1"
  hosts: redhat
  become: true
  vars:
    web_user: webdev
    doc_root: /var/www/html
    home_page: "{{ doc_root }}/index.html"
  tasks:
  - name: Install Apache (httpd) on RedHat
    ansible.builtin.yum:
      name: httpd
      state: present
    when: ansible_facts['os_family'] == "RedHat"
  - name: Ensure document root directory exists
    ansible.builtin.file:
      path: "{{ doc_root }}"
      state: directory
      owner: root
      group: root
      mode: "0755"
    when: ansible_facts['os_family'] == "RedHat"
  - name: Ensure the home page exists
    ansible.builtin.copy:
      dest: "{{ home_page }}"
      content: |
        <html>
          <head><title>Welcome</title></head>
          <body>
            <h1>Welcome to {{ inventory_hostname }}</h1>
            <p>Apache is installed and running.</p>
          </body>
        </html>
      owner: root
      group: root
      mode: "0644"
      force: false
    when: ansible_facts['os_family'] == "RedHat"
    notify: Restart httpd
  - name: Ensure Apache is started and enabled at boot
    ansible.builtin.service:
      name: httpd
      state: started
      enabled: true
    when: ansible_facts['os_family'] == "RedHat"
  - name: Create the webdev user
    ansible.builtin.user:
      name: "{{ web_user }}"
      state: present
      shell: /bin/bash
      create_home: true
    when: ansible_facts['os_family'] == "RedHat"
  handlers:
  - name: Restart httpd
    ansible.builtin.service:
      name: httpd
      state: restarted

