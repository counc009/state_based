---
- name: "Model claude-opus-5-5, Problem p18, Response 4"
  hosts: redhat
  become: true
  vars:
    web_user: webdev
    doc_root: /var/www/html
    home_page: "{{ doc_root }}/index.html"
  tasks:
  - name: Configure web server on RedHat family hosts
    when: ansible_facts['os_family'] == "RedHat"
    block:
    - name: Install Apache (httpd)
      ansible.builtin.yum:
        name: httpd
        state: present
    - name: Ensure document root exists
      ansible.builtin.file:
        path: "{{ doc_root }}"
        state: directory
        owner: root
        group: root
        mode: "0755"
    - name: Ensure the home page exists
      ansible.builtin.copy:
        dest: "{{ home_page }}"
        content: |
          <html>
            <head><title>Welcome</title></head>
            <body>
              <h1>Welcome to {{ ansible_facts['hostname'] }}</h1>
            </body>
          </html>
        owner: root
        group: root
        mode: "0644"
        force: false
    - name: Create the webdev user
      ansible.builtin.user:
        name: "{{ web_user }}"
        state: present
        create_home: true
        shell: /bin/bash
    - name: Ensure Apache is started and enabled
      ansible.builtin.service:
        name: httpd
        state: started
        enabled: true

