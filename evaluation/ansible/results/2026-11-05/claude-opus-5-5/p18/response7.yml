---
- name: "Model claude-opus-5-5, Problem p18, Response 7"
  hosts: redhat
  become: true
  vars:
    web_package: httpd
    web_service: httpd
    web_root: /var/www/html
    web_user: webdev
  tasks:
  - name: Install Apache web server
    ansible.builtin.yum:
      name: "{{ web_package }}"
      state: present
    when: ansible_facts['os_family'] == "RedHat"
  - name: Ensure web root directory exists
    ansible.builtin.file:
      path: "{{ web_root }}"
      state: directory
      owner: root
      group: root
      mode: "0755"
    when: ansible_facts['os_family'] == "RedHat"
  - name: Ensure the home page exists
    ansible.builtin.copy:
      dest: "{{ web_root }}/index.html"
      content: |
        <html>
          <head><title>Welcome</title></head>
          <body>
            <h1>Welcome to {{ ansible_facts['hostname'] }}</h1>
            <p>Apache is installed and running.</p>
          </body>
        </html>
      owner: root
      group: root
      mode: "0644"
      force: false
    when: ansible_facts['os_family'] == "RedHat"
  - name: Ensure Apache is started and enabled at boot
    ansible.builtin.service:
      name: "{{ web_service }}"
      state: started
      enabled: true
    when: ansible_facts['os_family'] == "RedHat"
  - name: Create the webdev user
    ansible.builtin.user:
      name: "{{ web_user }}"
      state: present
      shell: /bin/bash
      create_home: true
    when: ansible_facts['os_family'] == "RedHat"

