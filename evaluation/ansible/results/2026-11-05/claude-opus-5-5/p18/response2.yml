---
- name: "Model claude-opus-5-5, Problem p18, Response 2"
  hosts: redhat
  become: true
  vars:
    apache_package: httpd
    apache_service: httpd
    document_root: /var/www/html
    home_page: "{{ document_root }}/index.html"
    web_user: webdev
  tasks:
  - name: Install Apache web server
    ansible.builtin.yum:
      name: "{{ apache_package }}"
      state: present
    when: ansible_facts['os_family'] == "RedHat"
  - name: Ensure document root exists
    ansible.builtin.file:
      path: "{{ document_root }}"
      state: directory
      owner: root
      group: root
      mode: "0755"
    when: ansible_facts['os_family'] == "RedHat"
  - name: Ensure the home page exists
    ansible.builtin.copy:
      dest: "{{ home_page }}"
      content: |
        <!DOCTYPE html>
        <html>
          <head>
            <title>Welcome</title>
          </head>
          <body>
            <h1>Welcome to {{ ansible_facts['hostname'] }}</h1>
            <p>Apache is installed and running.</p>
          </body>
        </html>
      owner: root
      group: root
      mode: "0644"
      force: false
    when: ansible_facts['os_family'] == "RedHat"
  - name: Ensure Apache is started and enabled at boot
    ansible.builtin.service:
      name: "{{ apache_service }}"
      state: started
      enabled: true
    when: ansible_facts['os_family'] == "RedHat"
  - name: Create the webdev user
    ansible.builtin.user:
      name: "{{ web_user }}"
      state: present
      create_home: true
      shell: /bin/bash
      comment: "Web Developer"
    when: ansible_facts['os_family'] == "RedHat"

