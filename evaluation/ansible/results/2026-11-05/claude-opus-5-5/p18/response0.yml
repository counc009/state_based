---
- name: "Model claude-opus-5-5, Problem p18, Response 10"
  hosts: redhat
  become: true
  vars:
    web_user: webdev
    doc_root: /var/www/html
    home_page: "{{ doc_root }}/index.html"
  tasks:
  - name: Install Apache (httpd) package
    ansible.builtin.dnf:
      name: httpd
      state: present
    when: ansible_facts['os_family'] == "RedHat"
  - name: Create the webdev user
    ansible.builtin.user:
      name: "{{ web_user }}"
      state: present
      shell: /bin/bash
      create_home: true
    when: ansible_facts['os_family'] == "RedHat"
  - name: Ensure the document root exists
    ansible.builtin.file:
      path: "{{ doc_root }}"
      state: directory
      owner: root
      group: root
      mode: "0755"
    when: ansible_facts['os_family'] == "RedHat"
  - name: Ensure the home page exists
    ansible.builtin.copy:
      dest: "{{ home_page }}"
      content: |
        <!DOCTYPE html>
        <html>
          <head>
            <title>Welcome</title>
          </head>
          <body>
            <h1>Apache is running on {{ ansible_facts['hostname'] }}</h1>
          </body>
        </html>
      owner: "{{ web_user }}"
      group: "{{ web_user }}"
      mode: "0644"
      force: false
    when: ansible_facts['os_family'] == "RedHat"
  - name: Ensure Apache is started and enabled
    ansible.builtin.service:
      name: httpd
      state: started
      enabled: true
    when: ansible_facts['os_family'] == "RedHat"

