---
- name: "Model glm-5.3, Problem p06, Response 4"
  hosts: all
  become: true
  tasks:
  - name: Ensure Python 3.10 and venv module are installed
    ansible.builtin.package:
      name:
      - python3.10
      - python3.10-venv
      state: present
  - name: Create virtual environment at /user/home/venv and install numpy
    ansible.builtin.pip:
      name: numpy
      virtualenv: /user/home/venv
      virtualenv_command: "python3.10 -m venv"
      state: present

