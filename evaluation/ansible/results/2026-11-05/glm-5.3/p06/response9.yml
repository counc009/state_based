---
- name: "Model glm-5.3, Problem p06, Response 9"
  hosts: all
  become: true
  tasks:
  - name: Ensure python3.10 and venv support are installed
    ansible.builtin.apt:
      name:
      - python3.10
      - python3.10-venv
      state: present
      update_cache: true
  - name: Ensure /user/home directory exists
    ansible.builtin.file:
      path: /user/home
      state: directory
      mode: "0755"
  - name: Create Python 3.10 virtual environment and install numpy
    ansible.builtin.pip:
      name: numpy
      virtualenv: /user/home/venv
      virtualenv_command: "python3.10 -m venv"
      state: present

