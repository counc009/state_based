---
- name: "Model glm-5.3, Problem p17, Response 8"
  hosts: redhat,ubuntu
  become: true
  vars:
    postfix_config_urls:
      RedHat: "http://example.com/cfg.redhat"
      Ubuntu: "http://example.com/cfg.ubuntu"
  tasks:
  - name: Install latest postfix on RedHat
    ansible.builtin.dnf:
      name: postfix
      state: latest
    when: ansible_facts['os_family'] == "RedHat"
  - name: Install latest postfix on Ubuntu
    ansible.builtin.apt:
      name: postfix
      state: latest
      update_cache: true
    when: ansible_facts['distribution'] == "Ubuntu"
  - name: Backup default postfix configuration file
    ansible.builtin.copy:
      src: /etc/postfix/main.cf
      dest: /etc/postfix/main.cf
      remote_src: true
      backup: true
    when: ansible_facts['os_family'] == "RedHat" or ansible_facts['distribution']
      == "Ubuntu"
  - name: Download postfix configuration file
    ansible.builtin.get_url:
      url: "{{ postfix_config_urls[ansible_facts['distribution']] }}"
      dest: /etc/postfix/main.cf
      mode: '0644'
    when: ansible_facts['distribution'] in postfix_config_urls.keys()

