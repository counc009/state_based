---
- name: "Model glm-5.3, Problem p07, Response 5"
  hosts: all
  become: true
  tasks:
  - name: Install git
    ansible.builtin.package:
      name: git
      state: present
  - name: Clone release1.8.4 branch from ansible/ansible to /ansible
    ansible.builtin.git:
      repo: https://github.com/ansible/ansible.git
      dest: /ansible
      version: release1.8.4

