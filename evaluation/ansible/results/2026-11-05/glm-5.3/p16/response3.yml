---
- name: "Model glm-5.3, Problem p16, Response 3"
  hosts: all
  become: true
  tasks:
  - name: Install zsh
    ansible.builtin.package:
      name: zsh
      state: present
  - name: Set zsh as default shell for user dev
    ansible.builtin.user:
      name: dev
      shell: /bin/zsh
  - name: Ensure zsh configuration file exists for user dev
    ansible.builtin.file:
      path: /home/dev/.zshrc
      state: touch
      owner: dev
      group: dev
      mode: '0644'

