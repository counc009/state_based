---
- name: "Model glm-5.3, Problem p16, Response 6"
  hosts: all
  become: true
  tasks:
  - name: Install zsh
    ansible.builtin.package:
      name: zsh
      state: present
  - name: Ensure user dev exists with zsh as default shell
    ansible.builtin.user:
      name: dev
      shell: /bin/zsh
      state: present
  - name: Ensure zsh configuration file exists
    ansible.builtin.file:
      path: /home/dev/.zshrc
      state: touch
      owner: dev
      group: dev
      mode: '0644'
      modification_time: preserve
      access_time: preserve

