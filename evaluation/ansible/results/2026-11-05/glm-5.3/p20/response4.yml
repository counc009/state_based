---
- name: "Model glm-5.3, Problem p20, Response 4"
  hosts: redhat,debian
  become: true
  tasks:
  - name: Install openssh client and server on Debian
    ansible.builtin.apt:
      name:
      - openssh-client
      - openssh-server
      state: present
      update_cache: true
    when: ansible_facts['os_family'] == 'Debian'
  - name: Install openssh client and server on RedHat
    ansible.builtin.dnf:
      name:
      - openssh-clients
      - openssh-server
      state: present
    when: ansible_facts['os_family'] == 'RedHat'
  - name: Start and enable ssh service (Debian)
    ansible.builtin.service:
      name: ssh
      state: started
      enabled: true
    when: ansible_facts['os_family'] == 'Debian'
  - name: Start and enable sshd service (RedHat)
    ansible.builtin.service:
      name: sshd
      state: started
      enabled: true
    when: ansible_facts['os_family'] == 'RedHat'
  - name: Ensure user fizbaz exists
    ansible.builtin.user:
      name: fizbaz
      state: present
  - name: Look up fizbaz home directory
    ansible.builtin.getent:
      database: passwd
      key: fizbaz
  - name: Ensure .ssh directory exists for fizbaz
    ansible.builtin.file:
      path: "{{ ansible_facts.getent_passwd['fizbaz'][4] }}/.ssh"
      state: directory
      owner: fizbaz
      group: fizbaz
      mode: '0700'
  - name: Generate RSA SSH key for fizbaz
    community.crypto.openssh_keypair:
      path: "{{ ansible_facts.getent_passwd['fizbaz'][4] }}/.ssh/fizbaz_rsa"
      type: rsa
      owner: fizbaz
      group: fizbaz
      mode: '0600'

