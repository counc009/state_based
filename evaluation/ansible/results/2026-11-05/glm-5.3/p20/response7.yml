---
- name: "Model glm-5.3, Problem p20, Response 7"
  hosts: redhat,debian
  become: true
  vars:
    ssh_service_name: "{{ 'ssh' if ansible_facts['os_family'] == 'Debian' else 'sshd'
      }}"
    ssh_packages: "{{ ['openssh-client', 'openssh-server'] if ansible_facts['os_family']
      == 'Debian' else ['openssh-clients', 'openssh-server'] }}"
  tasks:
  - name: Install SSH client and server packages
    ansible.builtin.package:
      name: "{{ ssh_packages }}"
      state: present
  - name: Start and enable SSH service
    ansible.builtin.service:
      name: "{{ ssh_service_name }}"
      state: started
      enabled: true
  - name: Ensure user fizbaz exists
    ansible.builtin.user:
      name: fizbaz
      state: present
      create_home: true
  - name: Ensure .ssh directory exists for fizbaz
    ansible.builtin.file:
      path: /home/fizbaz/.ssh
      state: directory
      owner: fizbaz
      group: fizbaz
      mode: "0700"
  - name: Generate SSH key for fizbaz
    community.crypto.openssh_keypair:
      path: /home/fizbaz/.ssh/fizbaz_rsa
      type: rsa
      size: 2048
      owner: fizbaz
      group: fizbaz
      mode: "0600"

