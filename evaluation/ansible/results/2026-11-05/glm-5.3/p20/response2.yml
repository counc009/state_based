---
- name: "Model glm-5.3, Problem p20, Response 2"
  hosts: redhat,debian
  become: true
  vars:
    ssh_packages:
      Debian:
      - openssh-client
      - openssh-server
      RedHat:
      - openssh-clients
      - openssh-server
  tasks:
  - name: Install SSH client and server packages
    ansible.builtin.package:
      name: "{{ ssh_packages[ansible_os_family] }}"
      state: present
  - name: Start and enable SSH server
    ansible.builtin.service:
      name: sshd
      state: started
      enabled: true
  - name: Ensure user fizbaz exists
    ansible.builtin.user:
      name: fizbaz
      state: present
      create_home: true
  - name: Generate SSH key for fizbaz
    ansible.builtin.user:
      name: fizbaz
      generate_ssh_key: true
      ssh_key_type: rsa
      ssh_key_file: .ssh/fizbaz_rsa
      ssh_key_comment: fizbaz

