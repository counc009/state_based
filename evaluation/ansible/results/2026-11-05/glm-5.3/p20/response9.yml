---
- name: "Model glm-5.3, Problem p20, Response 9"
  hosts: redhat,debian
  become: true
  vars:
    ssh_packages:
      Debian:
      - openssh-client
      - openssh-server
      RedHat:
      - openssh-clients
      - openssh-server
    ssh_service_name:
      Debian: ssh
      RedHat: sshd
  tasks:
  - name: Install SSH client and server packages
    ansible.builtin.package:
      name: "{{ ssh_packages[ansible_facts['os_family']] }}"
      state: present
    when: ansible_facts['os_family'] in ['Debian', 'RedHat']
  - name: Start and enable SSH service
    ansible.builtin.service:
      name: "{{ ssh_service_name[ansible_facts['os_family']] }}"
      state: started
      enabled: true
    when: ansible_facts['os_family'] in ['Debian', 'RedHat']
  - name: Ensure user fizbaz exists
    ansible.builtin.user:
      name: fizbaz
      state: present
    when: ansible_facts['os_family'] in ['Debian', 'RedHat']
  - name: Generate RSA SSH key for fizbaz
    ansible.builtin.user:
      name: fizbaz
      generate_ssh_key: true
      ssh_key_file: .ssh/fizbaz_rsa
      ssh_key_type: rsa
    when: ansible_facts['os_family'] in ['Debian', 'RedHat']

