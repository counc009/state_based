---
- name: "Model glm-5.3, Problem p08, Response 3"
  hosts: all
  become: true
  tasks:
  - name: Update apt cache (Debian based systems)
    ansible.builtin.apt:
      update_cache: true
    when: ansible_facts['os_family'] == "Debian"
  - name: Install numpy on Debian based systems
    ansible.builtin.apt:
      name: python3-numpy
      state: present
    when: ansible_facts['os_family'] == "Debian"
  - name: Install numpy on RedHat based systems
    ansible.builtin.package:
      name: python3-numpy
      state: present
    when: ansible_facts['os_family'] == "RedHat"

