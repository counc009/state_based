---
- name: "Model glm-5.3, Problem p08, Response 8"
  hosts: all
  become: true
  tasks:
  - name: Install pip (Debian based systems)
    ansible.builtin.apt:
      name: python3-pip
      state: present
      update_cache: true
    when: ansible_facts['os_family'] | lower == 'debian'
  - name: Install pip (RedHat based systems)
    ansible.builtin.dnf:
      name: python3-pip
      state: present
    when: ansible_facts['os_family'] | lower == 'redhat'
  - name: Install numpy via pip
    ansible.builtin.pip:
      name: numpy
      state: present

