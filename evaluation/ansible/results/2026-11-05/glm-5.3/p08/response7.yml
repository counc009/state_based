---
- name: "Model glm-5.3, Problem p08, Response 7"
  hosts: all
  become: true
  tasks:
  - name: Install numpy (Debian based systems)
    ansible.builtin.apt:
      name: python3-numpy
      state: present
      update_cache: true
    when: ansible_facts['os_family'] == "Debian"
  - name: Install numpy (RedHat based systems)
    ansible.builtin.dnf:
      name: python3-numpy
      state: present
    when: ansible_facts['os_family'] == "RedHat"

