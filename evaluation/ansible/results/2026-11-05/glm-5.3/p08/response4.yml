---
- name: "Model glm-5.3, Problem p08, Response 4"
  hosts: all
  become: true
  tasks:
  - name: Install python3-numpy on Debian based systems
    ansible.builtin.apt:
      name: python3-numpy
      state: present
      update_cache: true
    when: ansible_facts['os_family'] == "Debian"
  - name: Install python3-numpy on RedHat based systems
    ansible.builtin.dnf:
      name: python3-numpy
      state: present
    when: ansible_facts['os_family'] == "RedHat" and ansible_facts['distribution_major_version']
      | int >= 8
  - name: Install python3-numpy on older RedHat based systems
    ansible.builtin.yum:
      name: python3-numpy
      state: present
    when: ansible_facts['os_family'] == "RedHat" and ansible_facts['distribution_major_version']
      | int < 8

