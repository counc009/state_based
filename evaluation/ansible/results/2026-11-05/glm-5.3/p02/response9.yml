---
- name: "Model glm-5.3, Problem p02, Response 9"
  hosts: all
  become: true
  tasks:
  - name: Ensure /etc/environment contains LC_ALL=C
    ansible.builtin.lineinfile:
      path: /etc/environment
      regexp: '^LC_ALL='
      line: 'LC_ALL=C'
      create: true
      mode: '0644'
  - name: Ensure LC_ALL=C is set in /etc/locale.conf
    ansible.builtin.lineinfile:
      path: /etc/locale.conf
      regexp: '^LC_ALL='
      line: 'LC_ALL=C'
      create: true
      mode: '0644'

