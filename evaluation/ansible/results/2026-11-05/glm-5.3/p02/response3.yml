---
- name: "Model glm-5.3, Problem p02, Response 3"
  hosts: all
  become: true
  tasks:
  - name: Ensure /etc/environment contains LC_ALL=C
    ansible.builtin.lineinfile:
      path: /etc/environment
      line: 'LC_ALL=C'
      state: present
      create: true
      mode: '0644'
  - name: Ensure LC_ALL is exported for login shells via /etc/profile.d
    ansible.builtin.copy:
      dest: /etc/profile.d/00-lc-all.sh
      content: |
        export LC_ALL=C
      owner: root
      group: root
      mode: '0644'
  - name: Ensure LC_ALL is set in /etc/locale.conf for systemd systems
    ansible.builtin.lineinfile:
      path: /etc/locale.conf
      line: 'LC_ALL=C'
      state: present
      create: true
      mode: '0644'

