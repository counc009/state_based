---
- name: "Model glm-5.3, Problem p11a, Response 4"
  hosts: all
  become: true
  tasks:
  - name: Copy .war files to /tmp on remote hosts
    ansible.builtin.copy:
      src: "{{ item }}"
      dest: /tmp/
      mode: '0644'
    loop: "{{ lookup('ansible.builtin.fileglob', '/backup/*.war', wantlist=true) }}"

