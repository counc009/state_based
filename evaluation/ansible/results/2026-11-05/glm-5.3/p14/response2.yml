---
- name: "Model glm-5.3, Problem p14, Response 2"
  hosts: debian
  become: true
  tasks:
  - name: Check if reboot is required
    ansible.builtin.stat:
      path: /var/run/reboot-required
    register: reboot_required_file
  - name: Display reboot requirement status
    ansible.builtin.debug:
      msg: "Reboot is required on this host"
    when: reboot_required_file.stat.exists
  - name: Reboot the system if required
    ansible.builtin.reboot:
      msg: "Reboot initiated by Ansible due to pending updates"
      connect_timeout: 5
      reboot_timeout: 600
      pre_reboot_delay: 0
      post_reboot_delay: 30
      test_command: uptime
    when:
    - ansible_os_family == "Debian"
    - reboot_required_file.stat.exists
  - name: Confirm system is back online
    ansible.builtin.debug:
      msg: "System has been rebooted and is back online"
    when:
    - ansible_os_family == "Debian"
    - reboot_required_file.stat.exists

