---
- name: "Model glm-5.3, Problem p18, Response 4"
  hosts: redhat
  become: true
  vars:
    httpd_packages:
    - httpd
  tasks:
  - name: Install Apache server (httpd)
    ansible.builtin.yum:
      name: "{{ httpd_packages }}"
      state: present
  - name: Ensure Apache service is started and enabled
    ansible.builtin.service:
      name: httpd
      state: started
      enabled: true
  - name: Ensure the home page exists
    ansible.builtin.copy:
      dest: /var/www/html/index.html
      content: |
        <html>
          <head><title>Welcome</title></head>
          <body>
            <h1>Welcome to our web server!</h1>
          </body>
        </html>
      owner: apache
      group: apache
      mode: '0644'
  - name: Create webdev user
    ansible.builtin.user:
      name: webdev
      state: present

