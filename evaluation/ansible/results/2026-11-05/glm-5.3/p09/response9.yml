---
- name: "Model glm-5.3, Problem p09, Response 9"
  hosts: all
  become: true
  tasks:
  - name: Ensure module load gcc is at the end of foo's bashrc
    ansible.builtin.lineinfile:
      path: /home/foo/.bashrc
      line: "module load gcc"
      create: true
      owner: foo
      group: foo
      mode: '0644'

