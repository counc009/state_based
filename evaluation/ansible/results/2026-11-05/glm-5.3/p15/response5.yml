---
- name: "Model glm-5.3, Problem p15, Response 5"
  hosts: all
  become: true
  tasks:
  - name: Find all entries in /home/mydata/web
    ansible.builtin.find:
      paths: /home/mydata/web
      hidden: true
      recurse: yes
      file_type: any
    register: web_contents
  - name: Delete the contents of /home/mydata/web
    ansible.builtin.file:
      path: "{{ item.path }}"
      state: absent
    loop: "{{ web_contents.files }}"
    loop_control:
      label: "{{ item.path }}"
    when: web_contents.files | length > 0

