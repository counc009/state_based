---
- name: "Model glm-5.3, Problem p15, Response 10"
  hosts: all
  become: true
  tasks:
  - name: Find all contents inside /home/mydata/web
    ansible.builtin.find:
      paths: /home/mydata/web
      hidden: true
      file_type: any
      recurse: true
    register: web_contents
  - name: Delete all files and directories inside /home/mydata/web
    ansible.builtin.file:
      path: "{{ item.path }}"
      state: absent
    loop: "{{ web_contents.files }}"
    loop_control:
      label: "{{ item.path }}"
    when: web_contents.files | length > 0

