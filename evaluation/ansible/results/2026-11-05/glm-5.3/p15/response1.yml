---
- name: "Model glm-5.3, Problem p15, Response 1"
  hosts: all
  become: true
  tasks:
  - name: Find all files and directories inside /home/mydata/web
    ansible.builtin.find:
      paths: /home/mydata/web
      hidden: true
      recurse: true
      file_type: any
    register: web_contents
  - name: Delete the found contents of /home/mydata/web
    ansible.builtin.file:
      path: "{{ item.path }}"
      state: absent
    loop: "{{ web_contents.files }}"
    loop_control:
      label: "{{ item.path }}"

