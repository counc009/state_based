---
- name: "Model glm-5.3, Problem p19, Response 7"
  hosts: all
  become: true
  tasks:
  - name: Ensure wheel group exists
    ansible.builtin.group:
      name: wheel
      state: present
  - name: Ensure /etc/sudoers.d directory exists
    ansible.builtin.file:
      path: /etc/sudoers.d
      state: directory
      owner: root
      group: root
      mode: '0750'
  - name: Ensure /etc/sudoers includes the sudoers.d directory
    ansible.builtin.lineinfile:
      path: /etc/sudoers
      regexp: '^#?\s*@includedir\s+/etc/sudoers.d'
      line: '@includedir /etc/sudoers.d'
      state: present
      validate: '/usr/sbin/visudo -cf %s'
  - name: Enable passwordless sudo for the wheel group
    ansible.builtin.copy:
      dest: /etc/sudoers.d/wheel
      content: '%wheel ALL=(ALL) NOPASSWD: ALL\n'
      owner: root
      group: root
      mode: '0440'
      validate: '/usr/sbin/visudo -cf %s'
  - name: Create the ansible user in the wheel group
    ansible.builtin.user:
      name: ansible
      groups: wheel
      append: true
      state: present
      create_home: true
      shell: /bin/bash

