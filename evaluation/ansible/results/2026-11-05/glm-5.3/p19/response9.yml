---
- name: "Model glm-5.3, Problem p19, Response 9"
  hosts: all
  become: true
  tasks:
  - name: Ensure wheel group exists
    ansible.builtin.group:
      name: wheel
      state: present
  - name: Enable passwordless sudo for wheel group
    ansible.builtin.copy:
      content: "%wheel ALL=(ALL) NOPASSWD: ALL\n"
      dest: /etc/sudoers.d/wheel-nopasswd
      owner: root
      group: root
      mode: '0440'
      validate: 'visudo -cf %s'
  - name: Create ansible user in wheel group
    ansible.builtin.user:
      name: ansible
      groups: wheel
      append: true
      state: present
      create_home: true
      shell: /bin/bash

