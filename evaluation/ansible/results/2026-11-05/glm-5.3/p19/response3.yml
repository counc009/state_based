---
- name: "Model glm-5.3, Problem p19, Response 3"
  hosts: all
  become: true
  tasks:
  - name: Ensure sudoers drop-in directory exists
    ansible.builtin.file:
      path: /etc/sudoers.d
      state: directory
      owner: root
      group: root
      mode: '0750'
  - name: Enable passwordless sudo for wheel group
    ansible.builtin.copy:
      dest: /etc/sudoers.d/wheel
      content: '%wheel ALL=(ALL) NOPASSWD: ALL\n'
      owner: root
      group: root
      mode: '0440'
      validate: 'visudo -cf %s'
  - name: Create ansible user in wheel group
    ansible.builtin.user:
      name: ansible
      groups: wheel
      append: true
      state: present
      create_home: true
      shell: /bin/bash

