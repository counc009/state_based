---
- name: "Model glm-5.3, Problem p19, Response 2"
  hosts: all
  become: true
  tasks:
  - name: Ensure wheel group exists
    ansible.builtin.group:
      name: wheel
      state: present
  - name: Grant passwordless sudo to wheel group
    ansible.builtin.copy:
      content: "%wheel ALL=(ALL) NOPASSWD: ALL\n"
      dest: /etc/sudoers.d/wheel
      owner: root
      group: root
      mode: "0440"
      validate: "visudo -cf %s"
  - name: Create ansible user and add to wheel group
    ansible.builtin.user:
      name: ansible
      groups: wheel
      append: true
      create_home: true
      shell: /bin/bash
      state: present

