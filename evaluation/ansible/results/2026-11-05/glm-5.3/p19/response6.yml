---
- name: "Model glm-5.3, Problem p19, Response 6"
  hosts: all
  become: true
  tasks:
  - name: Ensure wheel group exists
    ansible.builtin.group:
      name: wheel
      state: present
  - name: Enable passwordless sudo for the wheel group
    ansible.builtin.lineinfile:
      path: /etc/sudoers
      state: present
      regexp: '^%wheel\s+ALL='
      line: '%wheel ALL=(ALL) NOPASSWD: ALL'
      validate: '/usr/sbin/visudo -cf %s'
  - name: Create ansible user and add to wheel group
    ansible.builtin.user:
      name: ansible
      state: present
      groups: wheel
      append: true
      create_home: true
      shell: /bin/bash

