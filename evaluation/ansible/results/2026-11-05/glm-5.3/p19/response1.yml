---
- name: "Model glm-5.3, Problem p19, Response 1"
  hosts: all
  become: true
  tasks:
  - name: Ensure wheel group exists
    ansible.builtin.group:
      name: wheel
      state: present
  - name: Enable passwordless sudo for wheel group
    ansible.builtin.lineinfile:
      path: /etc/sudoers.d/wheel
      line: "%wheel ALL=(ALL) NOPASSWD: ALL"
      state: present
      mode: "0440"
      create: true
      validate: "/usr/sbin/visudo -cf %s"
  - name: Create ansible user and add to wheel group
    ansible.builtin.user:
      name: ansible
      groups: wheel
      append: true
      state: present
      shell: /bin/bash

