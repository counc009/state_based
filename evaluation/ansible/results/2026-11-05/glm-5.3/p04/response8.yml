---
- name: "Model glm-5.3, Problem p04, Response 8"
  hosts: all
  become: true
  tasks:
  - name: Find all directories under /srv/path
    ansible.builtin.find:
      paths: /srv/path
      file_type: directory
      recurse: true
    register: found_dirs
  - name: Find all files under /srv/path
    ansible.builtin.find:
      paths: /srv/path
      file_type: file
      recurse: true
    register: found_files
  - name: Set directories to 0755 (owner can write, everyone can list/read)
    ansible.builtin.file:
      path: "{{ item.path }}"
      mode: "0755"
      state: directory
    loop: "{{ found_dirs.files }}"
    loop_control:
      label: "{{ item.path }}"
  - name: Set files to 0644 (owner can write, everyone can read)
    ansible.builtin.file:
      path: "{{ item.path }}"
      mode: "0644"
      state: file
    loop: "{{ found_files.files }}"
    loop_control:
      label: "{{ item.path }}"
  - name: Set the top-level /srv/path directory itself to 0755
    ansible.builtin.file:
      path: /srv/path
      mode: "0755"
      state: directory

