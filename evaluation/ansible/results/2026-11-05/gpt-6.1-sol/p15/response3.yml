---
- name: "Model gpt-6.1-sol, Problem p15, Response 3"
  hosts: all
  become: true
  tasks:
  - name: Find all immediate children, including hidden entries
    ansible.builtin.find:
      paths: /home/mydata/web
      file_type: any
      hidden: true
      recurse: false
    register: web_contents
  - name: Remove all contents while preserving the directory
    ansible.builtin.file:
      path: "{{ item.path }}"
      state: absent
    loop: "{{ web_contents.files }}"
    loop_control:
      label: "{{ item.path }}"

