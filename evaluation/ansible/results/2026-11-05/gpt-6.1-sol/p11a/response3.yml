---
- name: "Model gpt-6.1-sol, Problem p11a, Response 3"
  hosts: all
  become: true
  tasks:
  - name: Copy all WAR files from /backup into /tmp
    ansible.builtin.copy:
      src: "{{ item }}"
      dest: /tmp/
      mode: preserve
    loop: "{{ query('ansible.builtin.fileglob', '/backup/*.war') }}"

