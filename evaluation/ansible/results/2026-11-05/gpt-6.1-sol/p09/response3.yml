---
- name: "Model gpt-6.1-sol, Problem p09, Response 3"
  hosts: all
  become: true
  tasks:
  - name: Look up foo's home directory
    ansible.builtin.getent:
      database: passwd
      key: foo
  - name: Ensure GCC module loading is present in bashrc
    ansible.builtin.lineinfile:
      path: "{{ ansible_facts.getent_passwd['foo'][4] }}/.bashrc"
      line: "module load gcc"
      insertafter: EOF
      create: true
      owner: foo
      mode: "0644"

