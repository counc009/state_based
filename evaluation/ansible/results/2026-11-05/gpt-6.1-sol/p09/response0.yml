---
- name: "Model gpt-6.1-sol, Problem p09, Response 10"
  hosts: all
  become: true
  tasks:
  - name: Append module load gcc to foo's bashrc
    ansible.builtin.lineinfile:
      path: /home/foo/.bashrc
      line: module load gcc
      insertafter: EOF
      create: true
      owner: foo
      mode: '0644'

