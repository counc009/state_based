---
- name: "Model gpt-6.1-sol, Problem p20, Response 3"
  hosts: redhat,debian
  become: true
  vars:
    ssh_platforms:
      Debian:
        packages:
        - openssh-client
        - openssh-server
        service: ssh
      RedHat:
        packages:
        - openssh-clients
        - openssh-server
        service: sshd
  tasks:
  - name: Verify the operating system is supported
    ansible.builtin.assert:
      that:
      - ansible_facts['os_family'] in ssh_platforms
      fail_msg: This playbook supports Debian and RedHat OS families.
  - name: Install SSH client and server packages
    ansible.builtin.package:
      name: "{{ ssh_platforms[ansible_facts['os_family']]['packages'] }}"
      state: present
  - name: Ensure fizbaz exists
    ansible.builtin.user:
      name: fizbaz
      state: present
      create_home: true
  - name: Create the SSH key directory
    ansible.builtin.file:
      path: /.ssh
      state: directory
      owner: fizbaz
      mode: "0700"
  - name: Generate fizbaz's RSA SSH key without replacing an existing key
    ansible.builtin.user:
      name: fizbaz
      generate_ssh_key: true
      ssh_key_type: rsa
      ssh_key_bits: 4096
      ssh_key_file: /.ssh/fizbaz_rsa
      force: false
  - name: Enable and start the SSH server
    ansible.builtin.service:
      name: "{{ ssh_platforms[ansible_facts['os_family']]['service'] }}"
      enabled: true
      state: started

