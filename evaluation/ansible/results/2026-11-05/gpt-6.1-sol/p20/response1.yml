---
- name: "Model gpt-6.1-sol, Problem p20, Response 1"
  hosts: redhat,debian
  become: true
  vars:
    ssh_packages:
      Debian:
      - openssh-client
      - openssh-server
      RedHat:
      - openssh-clients
      - openssh-server
    ssh_services:
      Debian: ssh
      RedHat: sshd
  tasks:
  - name: Verify the operating system is supported
    ansible.builtin.assert:
      that:
      - ansible_facts['os_family'] in ssh_packages
      fail_msg: This playbook supports Debian and RedHat OS families.
  - name: Refresh the APT package cache on Debian
    ansible.builtin.apt:
      update_cache: true
      cache_valid_time: 3600
    when: ansible_facts['os_family'] == 'Debian'
  - name: Install SSH client and server
    ansible.builtin.package:
      name: "{{ ssh_packages[ansible_facts['os_family']] }}"
      state: present
  - name: Enable and start the SSH server
    ansible.builtin.service:
      name: "{{ ssh_services[ansible_facts['os_family']] }}"
      enabled: true
      state: started
  - name: Ensure fizbaz's group exists
    ansible.builtin.group:
      name: fizbaz
      state: present
  - name: Ensure fizbaz's account exists
    ansible.builtin.user:
      name: fizbaz
      group: fizbaz
      create_home: true
      state: present
  - name: Create the requested SSH key directory
    ansible.builtin.file:
      path: /.ssh
      state: directory
      owner: fizbaz
      group: fizbaz
      mode: '0700'
  - name: Generate fizbaz's RSA key without overwriting an existing key
    ansible.builtin.user:
      name: fizbaz
      generate_ssh_key: true
      ssh_key_file: /.ssh/fizbaz_rsa
      ssh_key_type: rsa
      ssh_key_bits: 4096
      ssh_key_comment: fizbaz
      force: false

