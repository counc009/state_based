---
- name: "Model gpt-6.1-sol, Problem p19, Response 8"
  hosts: all
  become: true
  tasks:
  - name: Ensure wheel group exists
    ansible.builtin.group:
      name: wheel
      state: present
  - name: Create ansible user and add it to wheel
    ansible.builtin.user:
      name: ansible
      groups:
      - wheel
      append: true
      create_home: true
      state: present
  - name: Allow wheel members to use sudo without a password
    ansible.builtin.lineinfile:
      path: /etc/sudoers
      regexp: '^%wheel\s+'
      line: '%wheel ALL=(ALL) NOPASSWD: ALL'
      state: present
      validate: '/usr/sbin/visudo -cf %s'

