---
- name: "Model gpt-6.1-sol, Problem p06, Response 8"
  hosts: all
  become: true
  tasks:
  - name: Ensure the parent directory exists
    ansible.builtin.file:
      path: /user/home
      state: directory
      mode: "0755"
  - name: Create the virtual environment and install numpy
    ansible.builtin.pip:
      name: numpy
      state: present
      virtualenv: /user/home/venv
      virtualenv_command: python3.10 -m venv

