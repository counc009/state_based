---
- name: "Model gpt-6.1-sol, Problem p16, Response 6"
  hosts: all
  become: true
  tasks:
  - name: Install zsh
    ansible.builtin.package:
      name: zsh
      state: present
  - name: Set zsh as dev's default shell
    ansible.builtin.user:
      name: dev
      shell: /bin/zsh
      create_home: true
    register: dev_user
  - name: Ensure dev's zsh configuration file exists
    ansible.builtin.file:
      path: "{{ dev_user.home }}/.zshrc"
      state: touch
      owner: dev
      group: "{{ dev_user.group }}"
      mode: "0644"
      access_time: preserve
      modification_time: preserve

