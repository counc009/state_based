---
- name: "Model gpt-6.1-sol, Problem p16, Response 1"
  hosts: all
  become: true
  tasks:
  - name: Install zsh
    ansible.builtin.package:
      name: zsh
      state: present
  - name: Set zsh as the default shell for dev
    ansible.builtin.user:
      name: dev
      shell: /bin/zsh
      create_home: true
      state: present
    register: dev_account
  - name: Ensure the zsh configuration file exists without overwriting it
    ansible.builtin.file:
      path: "{{ dev_account.home }}/.zshrc"
      state: touch
      owner: dev
      group: "{{ dev_account.group }}"
      mode: "0644"
      access_time: preserve
      modification_time: preserve

