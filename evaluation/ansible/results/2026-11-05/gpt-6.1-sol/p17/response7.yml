---
- name: "Model gpt-6.1-sol, Problem p17, Response 7"
  hosts: redhat,ubuntu
  become: true
  tasks:
  - name: Configure Postfix on Ubuntu and RedHat systems
    when: >
      ansible_facts['distribution'] == 'Ubuntu' or ansible_facts['os_family'] == 'RedHat'
    block:
    - name: Refresh Ubuntu package cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
      when: ansible_facts['distribution'] == 'Ubuntu'
    - name: Install the latest available Postfix version
      ansible.builtin.package:
        name: postfix
        state: latest
    - name: Back up the default configuration without overwriting an existing backup
      ansible.builtin.copy:
        src: /etc/postfix/main.cf
        dest: /etc/postfix/main.cf.bak
        remote_src: true
        force: false
        owner: root
        group: root
        mode: preserve
    - name: Download the operating-system-specific configuration
      ansible.builtin.get_url:
        url: >-
          {{ 'http://example.com/cfg.ubuntu'
             if ansible_facts['distribution'] == 'Ubuntu'
             else 'http://example.com/cfg.redhat' }}
        dest: /etc/postfix/main.cf
        owner: root
        group: root
        mode: "0644"
        force: true

