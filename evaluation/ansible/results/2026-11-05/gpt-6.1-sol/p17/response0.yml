---
- name: "Model gpt-6.1-sol, Problem p17, Response 10"
  hosts: redhat,ubuntu
  become: true
  tasks:
  - name: Configure Postfix on Ubuntu and RedHat
    when:
    - ansible_facts['distribution'] == 'Ubuntu' or ansible_facts['os_family'] == 'RedHat'
    block:
    - name: Install the latest available version of Postfix
      ansible.builtin.package:
        name: postfix
        state: latest
        update_cache: true
    - name: Back up the default configuration without overwriting an existing backup
      ansible.builtin.copy:
        src: /etc/postfix/main.cf
        dest: /etc/postfix/main.cf.default
        remote_src: true
        force: false
        owner: root
        group: root
        mode: preserve
    - name: Download the distribution-specific configuration
      ansible.builtin.get_url:
        url: "{{ 'http://example.com/cfg.ubuntu' if ansible_facts['distribution']
          == 'Ubuntu' else 'http://example.com/cfg.redhat' }}"
        dest: /etc/postfix/main.cf
        owner: root
        group: root
        mode: '0644'
        force: true

