---
- name: "Model gpt-6.1-sol, Problem p17, Response 1"
  hosts: redhat,ubuntu
  become: true
  tasks:
  - name: Refresh the package cache on Ubuntu
    ansible.builtin.apt:
      update_cache: true
      cache_valid_time: 3600
    when: ansible_facts['distribution'] == 'Ubuntu'
  - name: Manage Postfix on supported systems
    when: >-
      ansible_facts['os_family'] == 'RedHat' or ansible_facts['distribution'] == 'Ubuntu'
    block:
    - name: Install the latest version of Postfix
      ansible.builtin.package:
        name: postfix
        state: latest
    - name: Back up the default configuration without overwriting an existing backup
      ansible.builtin.copy:
        src: /etc/postfix/main.cf
        dest: /etc/postfix/main.cf.default
        remote_src: true
        force: false
        owner: root
        group: root
        mode: preserve
    - name: Download the configuration for the operating system
      ansible.builtin.get_url:
        url: >-
          {{ 'http://example.com/cfg.ubuntu'
             if ansible_facts['distribution'] == 'Ubuntu'
             else 'http://example.com/cfg.redhat' }}
        dest: /etc/postfix/main.cf
        owner: root
        group: root
        mode: '0644'
      notify: Restart Postfix
  handlers:
  - name: Restart Postfix
    ansible.builtin.service:
      name: postfix
      state: restarted

