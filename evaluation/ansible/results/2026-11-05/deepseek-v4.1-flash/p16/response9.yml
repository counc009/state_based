---
- name: "Model deepseek-v4.1-flash, Problem p16, Response 9"
  hosts: all
  become: true
  tasks:
  - name: Install zsh
    ansible.builtin.package:
      name: zsh
      state: present
  - name: Set dev user's default shell to zsh
    ansible.builtin.user:
      name: dev
      shell: /bin/zsh
  - name: Ensure dev user's zsh configuration file exists
    ansible.builtin.file:
      path: /home/dev/.zshrc
      state: touch
      owner: dev
      mode: '0644'

