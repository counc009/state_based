---
- name: "Model deepseek-v4.1-flash, Problem p16, Response 10"
  hosts: all
  become: true
  vars:
    dev_user: dev
    zsh_shell: /bin/zsh
    zsh_config: "/home/{{ dev_user }}/.zshrc"
  tasks:
  - name: Install zsh
    ansible.builtin.package:
      name: zsh
      state: present
  - name: Set dev user's default shell to zsh
    ansible.builtin.user:
      name: "{{ dev_user }}"
      shell: "{{ zsh_shell }}"
      state: present
  - name: Ensure zsh configuration file exists
    ansible.builtin.file:
      path: "{{ zsh_config }}"
      state: touch
      owner: "{{ dev_user }}"
      group: "{{ dev_user }}"
      mode: '0644'
      modification_time: preserve
      access_time: preserve

