---
- name: "Model deepseek-v4.1-flash, Problem p16, Response 4"
  hosts: all
  become: true
  tasks:
  - name: Install zsh
    ansible.builtin.package:
      name: zsh
      state: present
  - name: Set zsh as default shell for dev
    ansible.builtin.user:
      name: dev
      shell: /bin/zsh
      state: present
  - name: Get dev user information
    ansible.builtin.getent:
      database: passwd
      key: dev
    register: dev_user
  - name: Ensure zsh configuration file exists
    ansible.builtin.file:
      path: "{{ dev_user.ansible_facts.getent_passwd.dev[4] }}/.zshrc"
      state: touch
      owner: dev
      group: dev
      mode: '0644'

