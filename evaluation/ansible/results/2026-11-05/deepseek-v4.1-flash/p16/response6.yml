---
- name: "Model deepseek-v4.1-flash, Problem p16, Response 6"
  hosts: all
  become: true
  tasks:
  - name: Install zsh
    ansible.builtin.package:
      name: zsh
      state: present
  - name: Set dev's default shell to zsh
    ansible.builtin.user:
      name: dev
      shell: /bin/zsh
  - name: Ensure .zshrc exists for dev
    ansible.builtin.file:
      path: ~dev/.zshrc
      state: touch
      owner: dev
      mode: '0644'

