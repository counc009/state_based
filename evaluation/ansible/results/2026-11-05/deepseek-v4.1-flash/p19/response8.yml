---
- name: "Model deepseek-v4.1-flash, Problem p19, Response 8"
  hosts: all
  become: true
  tasks:
  - name: Ensure wheel group exists
    ansible.builtin.group:
      name: wheel
      state: present
  - name: Create ansible user and add to wheel group
    ansible.builtin.user:
      name: ansible
      groups: wheel
      append: true
      state: present
      shell: /bin/bash
      create_home: true
  - name: Ensure sudoers.d directory exists
    ansible.builtin.file:
      path: /etc/sudoers.d
      state: directory
      owner: root
      group: root
      mode: '0750'
  - name: Enable passwordless sudo for wheel group
    ansible.builtin.copy:
      dest: /etc/sudoers.d/wheel
      content: |
        %wheel ALL=(ALL) NOPASSWD: ALL
      owner: root
      group: root
      mode: '0440'

