---
- name: "Model deepseek-v4.1-flash, Problem p19, Response 4"
  hosts: all
  become: true
  tasks:
  - name: Ensure wheel group has passwordless sudo
    ansible.builtin.copy:
      content: "%wheel ALL=(ALL) NOPASSWD: ALL\n"
      dest: /etc/sudoers.d/wheel
      owner: root
      group: root
      mode: '0440'
  - name: Create ansible user in wheel group
    ansible.builtin.user:
      name: ansible
      groups: wheel
      append: yes
      state: present

