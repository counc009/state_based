---
- name: "Model deepseek-v4.1-flash, Problem p19, Response 5"
  hosts: all
  become: true
  tasks:
  - name: Ensure wheel group exists
    ansible.builtin.group:
      name: wheel
      state: present
  - name: Create ansible user in wheel group
    ansible.builtin.user:
      name: ansible
      group: wheel
      groups: wheel
      append: true
      state: present
  - name: Ensure /etc/sudoers.d exists
    ansible.builtin.file:
      path: /etc/sudoers.d
      state: directory
      owner: root
      group: root
      mode: "0750"
  - name: Enable passwordless sudo for wheel group
    ansible.builtin.copy:
      dest: /etc/sudoers.d/wheel
      content: "%wheel ALL=(ALL) NOPASSWD: ALL\n"
      owner: root
      group: root
      mode: "0440"
      validate: "visudo -cf %s"

