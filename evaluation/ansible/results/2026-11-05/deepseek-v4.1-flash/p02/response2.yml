---
- name: "Model deepseek-v4.1-flash, Problem p02, Response 2"
  hosts: all
  become: true
  tasks:
  - name: Ensure LC_ALL is permanently set to C in /etc/environment
    ansible.builtin.lineinfile:
      path: /etc/environment
      regexp: '^LC_ALL='
      line: 'LC_ALL=C'
      state: present
      create: true
      mode: '0644'

