---
- name: "Model deepseek-v4.1-flash, Problem p02, Response 7"
  hosts: all
  become: true
  tasks:
  - name: Permanently set LC_ALL in /etc/environment
    ansible.builtin.lineinfile:
      path: /etc/environment
      regexp: '^LC_ALL='
      line: 'LC_ALL=C'
      create: true
      mode: '0644'

