---
- name: "Model deepseek-v4.1-flash, Problem p02, Response 6"
  hosts: all
  become: true
  tasks:
  - name: Set LC_ALL in /etc/environment
    ansible.builtin.lineinfile:
      path: /etc/environment
      regexp: '^LC_ALL='
      line: 'LC_ALL=C'
      create: true
      owner: root
      group: root
      mode: '0644'

