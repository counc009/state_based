---
- name: "Model deepseek-v4.1-flash, Problem p17, Response 4"
  hosts: redhat,ubuntu
  become: true
  tasks:
  - name: Install latest postfix
    ansible.builtin.package:
      name: postfix
      state: latest
  - name: Backup default postfix configuration
    ansible.builtin.copy:
      src: /etc/postfix/main.cf
      dest: /etc/postfix/main.cf.bak
      remote_src: true
      force: false
  - name: Download Ubuntu postfix configuration
    ansible.builtin.get_url:
      url: http://example.com/cfg.ubuntu
      dest: /etc/postfix/main.cf
      mode: '0644'
      force: true
    when: ansible_distribution == 'Ubuntu'
  - name: Download RedHat postfix configuration
    ansible.builtin.get_url:
      url: http://example.com/cfg.redhat
      dest: /etc/postfix/main.cf
      mode: '0644'
      force: true
    when: ansible_os_family == 'RedHat'

