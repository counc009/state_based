---
- name: "Model deepseek-v4.1-flash, Problem p20, Response 5"
  hosts: redhat,debian
  become: true
  vars:
    ssh_packages: >-
      {{
        ['openssh-client', 'openssh-server']
        if ansible_facts['os_family'] == 'Debian'
        else ['openssh-clients', 'openssh-server']
      }}
    ssh_service: "{{ 'ssh' if ansible_facts['os_family'] == 'Debian' else 'sshd' }}"
  tasks:
  - name: Install SSH client and server
    ansible.builtin.package:
      name: "{{ ssh_packages }}"
      state: present
  - name: Ensure SSH service is started and enabled
    ansible.builtin.service:
      name: "{{ ssh_service }}"
      state: started
      enabled: true
  - name: Ensure fizbaz group exists
    ansible.builtin.group:
      name: fizbaz
      state: present
  - name: Ensure fizbaz user exists
    ansible.builtin.user:
      name: fizbaz
      group: fizbaz
      state: present
  - name: Ensure /.ssh directory exists for fizbaz
    ansible.builtin.file:
      path: /.ssh
      state: directory
      owner: fizbaz
      group: fizbaz
      mode: '0700'
  - name: Generate SSH key for fizbaz at /.ssh/fizbaz_rsa
    ansible.builtin.user:
      name: fizbaz
      generate_ssh_key: true
      ssh_key_file: /.ssh/fizbaz_rsa
      ssh_key_type: rsa
      ssh_key_bits: 2048
      state: present

