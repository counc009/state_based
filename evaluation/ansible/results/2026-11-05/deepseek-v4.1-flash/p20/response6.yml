---
- name: "Model deepseek-v4.1-flash, Problem p20, Response 6"
  hosts: redhat,debian
  become: true
  vars:
    ssh_packages:
      Debian:
      - openssh-client
      - openssh-server
      RedHat:
      - openssh-clients
      - openssh-server
    ssh_service:
      Debian: ssh
      RedHat: sshd
  tasks:
  - name: Install SSH client and server packages
    ansible.builtin.package:
      name: "{{ ssh_packages[ansible_facts['os_family']] }}"
      state: present
  - name: Start and enable SSH service
    ansible.builtin.service:
      name: "{{ ssh_service[ansible_facts['os_family']] }}"
      state: started
      enabled: true
  - name: Ensure fizbaz user exists
    ansible.builtin.user:
      name: fizbaz
      state: present
      create_home: true
  - name: Ensure /.ssh directory exists
    ansible.builtin.file:
      path: /.ssh
      state: directory
      owner: fizbaz
      group: fizbaz
      mode: '0700'
  - name: Generate SSH key for fizbaz
    community.crypto.openssh_keypair:
      path: /.ssh/fizbaz_rsa
      type: rsa
      owner: fizbaz
      group: fizbaz
      mode: '0600'

