---
- name: "Model deepseek-v4.1-flash, Problem p08, Response 7"
  hosts: all
  become: true
  tasks:
  - name: Install numpy on Debian/Ubuntu
    ansible.builtin.apt:
      name: python3-numpy
      state: present
      update_cache: true
    when: ansible_facts['os_family'] == "Debian"
  - name: Install numpy on RedHat/CentOS
    ansible.builtin.package:
      name: python3-numpy
      state: present
    when: ansible_facts['os_family'] == "RedHat"

