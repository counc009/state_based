---
- name: "Model deepseek-v4.1-flash, Problem p04, Response 8"
  hosts: all
  become: true
  tasks:
  - name: Ensure /srv/path has correct permissions
    ansible.builtin.file:
      path: /srv/path
      mode: '0755'
  - name: Find all files under /srv/path
    ansible.builtin.find:
      paths: /srv/path
      file_type: file
      recurse: true
      hidden: true
    register: found_files
  - name: Set permissions on files to 0644
    ansible.builtin.file:
      path: "{{ item.path }}"
      mode: '0644'
    loop: "{{ found_files.files }}"
    loop_control:
      label: "{{ item.path }}"
  - name: Find all directories under /srv/path
    ansible.builtin.find:
      paths: /srv/path
      file_type: directory
      recurse: true
      hidden: true
    register: found_dirs
  - name: Set permissions on directories to 0755
    ansible.builtin.file:
      path: "{{ item.path }}"
      mode: '0755'
    loop: "{{ found_dirs.files }}"
    loop_control:
      label: "{{ item.path }}"

