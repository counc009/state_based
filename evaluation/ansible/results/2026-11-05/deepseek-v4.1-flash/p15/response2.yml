---
- name: "Model deepseek-v4.1-flash, Problem p15, Response 2"
  hosts: all
  become: true
  tasks:
  - name: Find all items in /home/mydata/web
    ansible.builtin.find:
      paths: /home/mydata/web
      patterns: "*"
      hidden: true
      file_type: any
    register: web_items
  - name: Delete all found items
    ansible.builtin.file:
      path: "{{ item.path }}"
      state: absent
    loop: "{{ web_items.files }}"

