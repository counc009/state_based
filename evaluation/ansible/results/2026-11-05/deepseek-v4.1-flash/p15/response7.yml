---
- name: "Model deepseek-v4.1-flash, Problem p15, Response 7"
  hosts: all
  become: true
  tasks:
  - name: Find all contents of /home/mydata/web
    ansible.builtin.find:
      paths: /home/mydata/web
      file_type: any
      hidden: true
    register: web_contents
  - name: Delete all found contents
    ansible.builtin.file:
      path: "{{ item.path }}"
      state: absent
    loop: "{{ web_contents.files }}"

