---
- name: "Model deepseek-v4.1-flash, Problem p18, Response 1"
  hosts: redhat
  become: true
  tasks:
  - name: Install Apache web server
    ansible.builtin.package:
      name: httpd
      state: present
    when: ansible_facts['os_family'] == "RedHat"
  - name: Ensure Apache service is enabled and running
    ansible.builtin.service:
      name: httpd
      state: started
      enabled: true
    when: ansible_facts['os_family'] == "RedHat"
  - name: Ensure Apache home page exists
    ansible.builtin.copy:
      dest: /var/www/html/index.html
      content: |
        Welcome to the Apache web server!
      owner: root
      group: root
      mode: '0644'
    when: ansible_facts['os_family'] == "RedHat"
  - name: Create webdev user
    ansible.builtin.user:
      name: webdev
      state: present
    when: ansible_facts['os_family'] == "RedHat"

