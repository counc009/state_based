---
- name: "Model deepseek-v4.1-flash, Problem p18, Response 6"
  hosts: redhat
  become: true
  tasks:
  - name: Install Apache HTTP Server
    ansible.builtin.package:
      name: httpd
      state: present
    when: ansible_facts['os_family'] == 'RedHat'
  - name: Ensure Apache service is enabled and running
    ansible.builtin.service:
      name: httpd
      state: started
      enabled: true
    when: ansible_facts['os_family'] == 'RedHat'
  - name: Ensure Apache document root exists
    ansible.builtin.file:
      path: /var/www/html
      state: directory
      owner: root
      group: root
      mode: '0755'
    when: ansible_facts['os_family'] == 'RedHat'
  - name: Ensure Apache home page exists
    ansible.builtin.copy:
      content: |
        <!DOCTYPE html>
        <html>
        <head>
            <title>Welcome</title>
        </head>
        <body>
            <h1>Apache is running</h1>
        </body>
        </html>
      dest: /var/www/html/index.html
      owner: root
      group: root
      mode: '0644'
    when: ansible_facts['os_family'] == 'RedHat'
  - name: Create webdev user
    ansible.builtin.user:
      name: webdev
      state: present
    when: ansible_facts['os_family'] == 'RedHat'

