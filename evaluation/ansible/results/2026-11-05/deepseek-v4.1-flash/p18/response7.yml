---
- name: "Model deepseek-v4.1-flash, Problem p18, Response 7"
  hosts: redhat
  become: true
  tasks:
  - name: Install Apache HTTP Server
    ansible.builtin.package:
      name: httpd
      state: present
    when: ansible_os_family == "RedHat"
  - name: Ensure Apache home page exists
    ansible.builtin.copy:
      dest: /var/www/html/index.html
      content: |
        <!DOCTYPE html>
        <html>
          <head>
            <title>Welcome</title>
          </head>
          <body>
            <h1>Welcome to Apache</h1>
          </body>
        </html>
      owner: root
      group: root
      mode: '0644'
    when: ansible_os_family == "RedHat"
  - name: Create webdev user
    ansible.builtin.user:
      name: webdev
      state: present
    when: ansible_os_family == "RedHat"
  - name: Ensure httpd is enabled and running
    ansible.builtin.service:
      name: httpd
      state: started
      enabled: true
    when: ansible_os_family == "RedHat"

