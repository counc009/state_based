---
- name: "Model deepseek-v4.1-flash, Problem p18, Response 4"
  hosts: redhat
  become: true
  tasks:
  - name: Install Apache HTTP Server
    ansible.builtin.package:
      name: httpd
      state: present
  - name: Ensure Apache is running and enabled
    ansible.builtin.service:
      name: httpd
      state: started
      enabled: true
  - name: Ensure home page exists
    ansible.builtin.copy:
      dest: /var/www/html/index.html
      content: |
        <!DOCTYPE html>
        <html>
        <head>
            <title>Welcome</title>
        </head>
        <body>
            <h1>Apache is running</h1>
        </body>
        </html>
      owner: apache
      group: apache
      mode: '0644'
  - name: Create webdev user
    ansible.builtin.user:
      name: webdev
      state: present

