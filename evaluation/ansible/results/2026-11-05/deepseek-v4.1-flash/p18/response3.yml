---
- name: "Model deepseek-v4.1-flash, Problem p18, Response 3"
  hosts: redhat
  become: true
  tasks:
  - name: Configure RedHat-specific tasks
    block:
    - name: Install Apache web server
      ansible.builtin.package:
        name: httpd
        state: present
    - name: Ensure Apache service is enabled and running
      ansible.builtin.service:
        name: httpd
        state: started
        enabled: true
    - name: Ensure web root directory exists
      ansible.builtin.file:
        path: /var/www/html
        state: directory
        owner: root
        group: root
        mode: '0755'
    - name: Ensure home page exists
      ansible.builtin.copy:
        dest: /var/www/html/index.html
        content: |
          Welcome to Apache!
        owner: root
        group: root
        mode: '0644'
    - name: Create webdev user
      ansible.builtin.user:
        name: webdev
        state: present
    when: ansible_facts['os_family'] == 'RedHat'

