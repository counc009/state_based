---
- name: "Model deepseek-v4.1-flash, Problem p14, Response 5"
  hosts: debian
  become: true
  tasks:
  - name: Check if a reboot is required on Debian
    ansible.builtin.stat:
      path: /var/run/reboot-required
    register: reboot_required
    when: ansible_distribution == "Debian"
  - name: Reboot Debian system if required
    ansible.builtin.reboot:
      msg: "Reboot initiated by Ansible because a reboot is required"
      reboot_timeout: 600
    when:
    - ansible_distribution == "Debian"
    - reboot_required.stat.exists | default(false)

