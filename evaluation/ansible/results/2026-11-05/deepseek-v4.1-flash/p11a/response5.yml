---
- name: "Model deepseek-v4.1-flash, Problem p11a, Response 5"
  hosts: all
  become: true
  tasks:
  - name: Copy all .war files from controller /backup to remote /tmp
    ansible.builtin.copy:
      src: "{{ item }}"
      dest: "/tmp/{{ item | basename }}"
    with_fileglob:
    - /backup/*.war

