---
- name: "Model deepseek-v4-flash, Problem p17, Response 6"
  hosts: redhat,ubuntu
  become: true
  tasks:
  - name: Install latest Postfix
    ansible.builtin.package:
      name: postfix
      state: latest
  - name: Download Postfix configuration for RedHat
    ansible.builtin.get_url:
      url: http://example.com/cfg.redhat
      dest: /etc/postfix/main.cf
      backup: true
      mode: '0644'
    when: ansible_facts['os_family'] == "RedHat"
  - name: Download Postfix configuration for Ubuntu
    ansible.builtin.get_url:
      url: http://example.com/cfg.ubuntu
      dest: /etc/postfix/main.cf
      backup: true
      mode: '0644'
    when:
    - ansible_facts['os_family'] == "Debian"
    - ansible_facts['distribution'] == "Ubuntu"

