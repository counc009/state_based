---
- name: "Model deepseek-v4-flash, Problem p15, Response 2"
  hosts: all
  become: true
  tasks:
  - name: Find all items in the directory
    ansible.builtin.find:
      path: /home/mydata/web
      file_type: any
      recurse: no
    register: directory_contents
  - name: Remove all found items
    ansible.builtin.file:
      path: "{{ item.path }}"
      state: absent
      recurse: yes
    loop: "{{ directory_contents.files }}"

