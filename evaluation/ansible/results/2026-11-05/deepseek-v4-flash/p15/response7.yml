---
- name: "Model deepseek-v4-flash, Problem p15, Response 7"
  hosts: all
  become: true
  tasks:
  - name: Find all contents in /home/mydata/web
    ansible.builtin.find:
      paths: /home/mydata/web
      file_type: any
      hidden: yes
      recurse: no
    register: web_contents
  - name: Delete all found contents
    ansible.builtin.file:
      path: "{{ item.path }}"
      state: absent
    loop: "{{ web_contents.files + web_contents.directories }}"

