---
- name: "Model deepseek-v4-flash, Problem p15, Response 1"
  hosts: all
  become: true
  tasks:
  - name: Find all items in /home/mydata/web
    ansible.builtin.find:
      paths: /home/mydata/web
      file_type: any
      recurse: false
      hidden: true
    register: web_contents
  - name: Remove found items
    ansible.builtin.file:
      path: "{{ item.path }}"
      state: absent
    loop: "{{ web_contents.files }}"

