---
- name: "Model deepseek-v4-flash, Problem p15, Response 8"
  hosts: all
  become: true
  tasks:
  - name: Find all items in /home/mydata/web
    ansible.builtin.find:
      paths: /home/mydata/web
      hidden: true
      recurse: yes
      file_type: any
    register: web_contents
  - name: Remove all found files and directories
    ansible.builtin.file:
      path: "{{ item.path }}"
      state: absent
    loop: "{{ web_contents.files }}"

