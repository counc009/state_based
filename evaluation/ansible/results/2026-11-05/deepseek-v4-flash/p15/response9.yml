---
- name: "Model deepseek-v4-flash, Problem p15, Response 9"
  hosts: all
  become: true
  tasks:
  - name: Find all items under /home/mydata/web
    ansible.builtin.find:
      paths: /home/mydata/web
      file_type: any
      recurse: true
      hidden: true
    register: web_contents
  - name: Delete all contents (deepest first)
    ansible.builtin.file:
      path: "{{ item.path }}"
      state: absent
    loop: "{{ web_contents.files | sort(attribute='path', reverse=true) }}"

