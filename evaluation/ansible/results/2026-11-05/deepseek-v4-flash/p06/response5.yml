---
- name: "Model deepseek-v4-flash, Problem p06, Response 5"
  hosts: all
  become: true
  tasks:
  - name: Ensure parent directory exists
    ansible.builtin.file:
      path: /user/home
      state: directory
      mode: '0755'
  - name: Create virtualenv and install numpy
    ansible.builtin.pip:
      name: numpy
      virtualenv: /user/home/venv
      virtualenv_command: python3.10 -m venv

