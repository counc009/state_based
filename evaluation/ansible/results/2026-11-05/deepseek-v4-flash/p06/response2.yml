---
- name: "Model deepseek-v4-flash, Problem p06, Response 2"
  hosts: all
  become: true
  tasks:
  - name: Ensure parent directory exists
    ansible.builtin.file:
      path: /user/home
      state: directory
  - name: Create Python 3.10 virtual environment and install numpy
    ansible.builtin.pip:
      name: numpy
      virtualenv: /user/home/venv
      virtualenv_command: /usr/bin/python3.10 -m venv

