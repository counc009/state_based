---
- name: "Model deepseek-v4-flash, Problem p20, Response 10"
  hosts: redhat,debian
  become: true
  vars:
    ssh_packages:
      Debian:
      - openssh-client
      - openssh-server
      RedHat:
      - openssh-clients
      - openssh-server
    ssh_service:
      Debian: ssh
      RedHat: sshd
  tasks:
  - name: Ensure fizbaz user exists
    ansible.builtin.user:
      name: fizbaz
      state: present
  - name: Install SSH client and server packages
    ansible.builtin.package:
      name: "{{ ssh_packages[ansible_os_family] }}"
      state: present
  - name: Start and enable SSH server
    ansible.builtin.service:
      name: "{{ ssh_service[ansible_os_family] }}"
      state: started
      enabled: true
  - name: Ensure /.ssh directory exists for fizbaz
    ansible.builtin.file:
      path: /.ssh
      state: directory
      owner: fizbaz
      mode: "0700"
  - name: Generate RSA SSH key for fizbaz
    community.crypto.openssh_keypair:
      path: /.ssh/fizbaz_rsa
      owner: fizbaz
      mode: "0600"
      type: rsa
      size: 4096
      comment: "fizbaz@{{ ansible_hostname }}"
      state: present

