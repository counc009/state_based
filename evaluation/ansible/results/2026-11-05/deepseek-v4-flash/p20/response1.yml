---
- name: "Model deepseek-v4-flash, Problem p20, Response 1"
  hosts: redhat,debian
  become: true
  vars:
    ssh_user: fizbaz
    packages_by_family:
      Debian:
      - openssh-client
      - openssh-server
      RedHat:
      - openssh-clients
      - openssh-server
    services_by_family:
      Debian: ssh
      RedHat: sshd
  tasks:
  - name: Ensure SSH user exists
    ansible.builtin.user:
      name: "{{ ssh_user }}"
      state: present
      create_home: true
    register: ssh_user_info
  - name: Install SSH client and server packages
    ansible.builtin.package:
      name: "{{ packages_by_family[ansible_os_family] | default([]) }}"
      state: present
    when: ansible_os_family in packages_by_family
  - name: Ensure .ssh directory exists for the user
    ansible.builtin.file:
      path: "{{ ssh_user_info.home }}/.ssh"
      state: directory
      owner: "{{ ssh_user }}"
      group: "{{ ssh_user_info.group }}"
      mode: "0700"
  - name: Generate SSH RSA key for the user
    community.crypto.openssh_keypair:
      path: "{{ ssh_user_info.home }}/.ssh/fizbaz_rsa"
      type: rsa
      owner: "{{ ssh_user }}"
      group: "{{ ssh_user_info.group }}"
      mode: "0600"
      comment: "{{ ssh_user }}@{{ ansible_hostname }}"
  - name: Start and enable SSH server
    ansible.builtin.service:
      name: "{{ services_by_family[ansible_os_family] }}"
      state: started
      enabled: true
    when: ansible_os_family in services_by_family

