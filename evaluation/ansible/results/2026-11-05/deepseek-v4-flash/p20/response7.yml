---
- name: "Model deepseek-v4-flash, Problem p20, Response 7"
  hosts: redhat,debian
  become: true
  tasks:
  - name: Install SSH packages on Debian
    ansible.builtin.package:
      name:
      - openssh-client
      - openssh-server
      state: present
    when: ansible_os_family == 'Debian'
  - name: Install SSH packages on RedHat
    ansible.builtin.package:
      name:
      - openssh-clients
      - openssh-server
      state: present
    when: ansible_os_family == 'RedHat'
  - name: Enable and start SSH server
    ansible.builtin.service:
      name: "{{ 'ssh' if ansible_os_family == 'Debian' else 'sshd' }}"
      state: started
      enabled: true
  - name: Ensure fizbaz user exists
    ansible.builtin.user:
      name: fizbaz
      state: present
  - name: Ensure /.ssh directory exists for fizbaz
    ansible.builtin.file:
      path: /.ssh
      state: directory
      owner: fizbaz
      group: fizbaz
      mode: '0700'
  - name: Generate SSH key for fizbaz at /.ssh/fizbaz_rsa
    ansible.builtin.user:
      name: fizbaz
      generate_ssh_key: true
      ssh_key_file: /.ssh/fizbaz_rsa
      ssh_key_type: rsa
      ssh_key_bits: 4096
      force: false

