---
- name: "Model deepseek-v4-flash, Problem p20, Response 3"
  hosts: redhat,debian
  become: true
  vars:
    ssh_packages:
      Debian:
      - openssh-client
      - openssh-server
      RedHat:
      - openssh-clients
      - openssh-server
    ssh_service_name:
      Debian: ssh
      RedHat: sshd
    ssh_key_path: /.ssh/fizbaz_rsa
    ssh_key_comment: fizbaz
  tasks:
  - name: Install SSH client and server packages
    ansible.builtin.package:
      name: "{{ ssh_packages[ansible_os_family] }}"
      state: present
    when: ansible_os_family in ssh_packages
  - name: Start and enable SSH server
    ansible.builtin.service:
      name: "{{ ssh_service_name[ansible_os_family] }}"
      state: started
      enabled: true
    when: ansible_os_family in ssh_service_name
  - name: Ensure fizbaz user exists
    ansible.builtin.user:
      name: fizbaz
      state: present
  - name: Ensure .ssh directory exists
    ansible.builtin.file:
      path: "{{ ssh_key_path | dirname }}"
      state: directory
      owner: fizbaz
      group: fizbaz
      mode: "0700"
  - name: Generate SSH key for fizbaz
    community.crypto.openssh_keypair:
      path: "{{ ssh_key_path }}"
      type: rsa
      owner: fizbaz
      group: fizbaz
      mode: "0600"
      comment: "{{ ssh_key_comment }}"
      force: false

