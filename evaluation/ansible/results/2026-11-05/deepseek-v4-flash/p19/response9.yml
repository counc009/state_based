---
- name: "Model deepseek-v4-flash, Problem p19, Response 9"
  hosts: all
  become: true
  tasks:
  - name: Ensure wheel group exists
    ansible.builtin.group:
      name: wheel
      state: present
  - name: Create ansible user in wheel group
    ansible.builtin.user:
      name: ansible
      groups: wheel
      append: yes
      state: present
      create_home: yes
      shell: /bin/bash
  - name: Ensure sudoers.d directory exists
    ansible.builtin.file:
      path: /etc/sudoers.d
      state: directory
      mode: '0755'
  - name: Enable passwordless sudo for wheel group
    ansible.builtin.copy:
      dest: /etc/sudoers.d/wheel
      content: "%wheel ALL=(ALL) NOPASSWD: ALL\n"
      mode: '0440'
      owner: root
      group: root

