---
- name: "Model deepseek-v4-flash, Problem p19, Response 8"
  hosts: all
  become: true
  tasks:
  - name: Ensure wheel group exists
    group:
      name: wheel
      state: present
  - name: Create ansible user in wheel group
    user:
      name: ansible
      groups: wheel
      append: yes
      create_home: yes
      shell: /bin/bash
      state: present
  - name: Enable passwordless sudo for wheel group
    lineinfile:
      path: /etc/sudoers.d/wheel
      line: '%wheel ALL=(ALL) NOPASSWD: ALL'
      create: yes
      mode: '0440'
      validate: 'visudo -cf %s'

