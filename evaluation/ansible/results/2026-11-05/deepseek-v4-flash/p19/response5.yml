---
- name: "Model deepseek-v4-flash, Problem p19, Response 5"
  hosts: all
  become: true
  tasks:
  - name: Ensure wheel group exists
    group:
      name: wheel
      state: present
  - name: Create ansible user and add to wheel group
    user:
      name: ansible
      groups: wheel
      append: yes
      state: present
      create_home: yes
      shell: /bin/bash
  - name: Ensure sudoers.d directory is included
    lineinfile:
      path: /etc/sudoers
      line: '#includedir /etc/sudoers.d'
      state: present
  - name: Configure passwordless sudo for wheel group
    copy:
      dest: /etc/sudoers.d/wheel
      content: |
        %wheel ALL=(ALL) NOPASSWD: ALL
      mode: '0440'
      owner: root
      group: root

