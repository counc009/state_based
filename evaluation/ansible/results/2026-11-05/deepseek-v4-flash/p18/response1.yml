---
- name: "Model deepseek-v4-flash, Problem p18, Response 1"
  hosts: redhat
  become: true
  tasks:
  - name: Install httpd (Apache)
    ansible.builtin.package:
      name: httpd
      state: present
  - name: Ensure Apache homepage exists
    ansible.builtin.copy:
      dest: /var/www/html/index.html
      content: |
        <html>
          <body>
            <h1>Welcome to Apache</h1>
          </body>
        </html>
      owner: root
      group: root
      mode: '0644'
  - name: Create webdev user
    ansible.builtin.user:
      name: webdev
      state: present

