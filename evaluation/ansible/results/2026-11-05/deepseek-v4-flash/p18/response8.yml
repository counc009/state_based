---
- name: "Model deepseek-v4-flash, Problem p18, Response 8"
  hosts: redhat
  become: true
  tasks:
  - name: Install Apache
    ansible.builtin.dnf:
      name: httpd
      state: present
  - name: Ensure Apache homepage exists
    ansible.builtin.copy:
      dest: /var/www/html/index.html
      content: |
        <html>
          <body>
            <h1>Welcome</h1>
          </body>
        </html>
      owner: root
      group: root
      mode: '0644'
  - name: Ensure Apache is enabled and running
    ansible.builtin.service:
      name: httpd
      state: started
      enabled: yes
  - name: Create webdev user
    ansible.builtin.user:
      name: webdev
      state: present

