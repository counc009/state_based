---
- name: "Model deepseek-v4-flash, Problem p18, Response 4"
  hosts: redhat
  become: true
  tasks:
  - name: Install Apache (httpd)
    ansible.builtin.package:
      name: httpd
      state: present
  - name: Ensure Apache is enabled and running
    ansible.builtin.service:
      name: httpd
      state: started
      enabled: true
  - name: Ensure the home page exists
    ansible.builtin.copy:
      dest: /var/www/html/index.html
      content: |
        <html>
          <body>
            <h1>Welcome to Apache</h1>
          </body>
        </html>
      mode: '0644'
  - name: Create the webdev user
    ansible.builtin.user:
      name: webdev
      state: present

