---
- name: "Model deepseek-v4-flash, Problem p11b, Response 10"
  hosts: debian
  become: true
  tasks:
  - name: Ensure /backup exists on controller
    ansible.builtin.file:
      path: /backup
      state: directory
    delegate_to: localhost
    run_once: true
  - name: Find all .war files in /tmp on remote
    ansible.builtin.find:
      paths: /tmp
      patterns: "*.war"
    register: war_files
  - name: Fetch each .war file to controller /backup
    ansible.builtin.fetch:
      src: "{{ item.path }}"
      dest: /backup/
      flat: true
    loop: "{{ war_files.files }}"

