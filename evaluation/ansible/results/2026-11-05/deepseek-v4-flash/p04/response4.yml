---
- name: "Model deepseek-v4-flash, Problem p04, Response 4"
  hosts: all
  become: true
  tasks:
  - name: Set permissions on the top-level directory
    ansible.builtin.file:
      path: /srv/path
      state: directory
      mode: u=rwX,g=rX,o=rX
  - name: Recursively set permissions on all files and directories
    ansible.builtin.file:
      path: /srv/path
      state: directory
      mode: u=rwX,g=rX,o=rX
      recurse: yes

