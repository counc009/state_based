---
- name: "Model deepseek-v4-flash, Problem p02, Response 10"
  hosts: all
  become: true
  tasks:
  - name: Ensure LC_ALL=C is configured in /etc/environment
    ansible.builtin.lineinfile:
      path: /etc/environment
      regexp: '^LC_ALL='
      line: 'LC_ALL=C'
      state: present
      create: yes

