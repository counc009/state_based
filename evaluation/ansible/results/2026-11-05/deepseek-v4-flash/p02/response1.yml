---
- name: "Model deepseek-v4-flash, Problem p02, Response 1"
  hosts: all
  become: true
  tasks:
  - name: Ensure LC_ALL=C is set in /etc/environment
    ansible.builtin.lineinfile:
      path: /etc/environment
      regexp: '^LC_ALL='
      line: 'LC_ALL=C'
      create: true
      state: present

