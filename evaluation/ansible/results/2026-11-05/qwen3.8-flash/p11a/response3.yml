---
- name: "Model qwen3.8-flash, Problem p11a, Response 3"
  hosts: all
  become: true
  tasks:
  - name: Find .war files on the controller
    ansible.builtin.find:
      paths: /backup
      patterns:
      - "*.war"
      file_type: file
    delegate_to: localhost
    register: war_files
  - name: Copy .war files to /tmp on the remote host
    ansible.builtin.copy:
      src: "{{ item.path }}"
      dest: /tmp
    loop: "{{ war_files.files | default([]) }}"
    loop_control:
      label: "{{ item.path }}"

