---
- name: "Model qwen3.8-flash, Problem p11a, Response 6"
  hosts: all
  become: true
  tasks:
  - name: Copy all .war files from /backup to /tmp
    ansible.builtin.copy:
      src: "{{ item }}"
      dest: /tmp/
      remote_src: false
    loop: "{{ lookup('fileglob', '/backup/*.war', wantlist=True) }}"

