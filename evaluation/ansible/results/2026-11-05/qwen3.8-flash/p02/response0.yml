---
- name: "Model qwen3.8-flash, Problem p02, Response 10"
  hosts: all
  become: true
  tasks:
  - name: Ensure LC_ALL=C is configured in /etc/environment
    ansible.builtin.lineinfile:
      path: /etc/environment
      regexp: '^\s*LC_ALL\s*='
      line: 'LC_ALL=C'
      create: true
      owner: root
      group: root
      mode: '0644'

