---
- name: "Model qwen3.8-flash, Problem p02, Response 3"
  hosts: all
  become: true
  tasks:
  - name: Ensure LC_ALL=C is present in /etc/environment
    ansible.builtin.lineinfile:
      path: /etc/environment
      regexp: '^\s*#?\s*LC_ALL\s*='
      line: 'LC_ALL=C'
      state: present
      create: true
      mode: '0644'
      owner: root
      group: root

