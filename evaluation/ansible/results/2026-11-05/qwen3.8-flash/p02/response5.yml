---
- name: "Model qwen3.8-flash, Problem p02, Response 5"
  hosts: all
  become: true
  tasks:
  - name: Ensure LC_ALL is permanently set to C system-wide
    ansible.builtin.lineinfile:
      path: /etc/environment
      regexp: '^\s*(export\s+)?LC_ALL\s*='
      line: 'LC_ALL="C"'
      state: present
      create: true
      mode: "0644"

