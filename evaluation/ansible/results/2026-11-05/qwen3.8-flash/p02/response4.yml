---
- name: "Model qwen3.8-flash, Problem p02, Response 4"
  hosts: all
  become: true
  tasks:
  - name: Ensure LC_ALL is set in /etc/environment
    ansible.builtin.lineinfile:
      path: /etc/environment
      regexp: '^\s*LC_ALL\s*='
      line: 'LC_ALL=C'
      state: present
      create: true
      mode: '0644'

