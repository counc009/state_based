---
- name: "Model qwen3.8-flash, Problem p20, Response 3"
  hosts: redhat,debian
  become: true
  vars:
    ssh_user: fizbaz
    ssh_key_home: /.ssh
    ssh_key_file: fizbaz_rsa
    ssh_key_path: /.ssh/fizbaz_rsa
  tasks:
  - name: Configure SSH on Debian and RedHat systems
    when: ansible_facts['os_family'] in ['Debian', 'RedHat']
    block:
    - name: Set the SSH service name for this OS family
      ansible.builtin.set_fact:
        ssh_service_name: "{{ 'ssh' if ansible_facts['os_family'] == 'Debian' else
          'sshd' }}"
    - name: Update apt cache on Debian
      ansible.builtin.apt:
        update_cache: true
      when: ansible_facts['os_family'] == 'Debian'
    - name: Install SSH client and server packages on Debian
      ansible.builtin.package:
        name:
        - openssh-client
        - openssh-server
        state: present
      when: ansible_facts['os_family'] == 'Debian'
    - name: Install SSH client and server packages on RedHat
      ansible.builtin.package:
        name:
        - openssh-clients
        - openssh-server
        state: present
      when: ansible_facts['os_family'] == 'RedHat'
    - name: Ensure SSH user group exists
      ansible.builtin.group:
        name: "{{ ssh_user }}"
        state: present
    - name: Ensure SSH key home directory exists
      ansible.builtin.file:
        path: "{{ ssh_key_home }}"
        state: directory
        mode: '0700'
    - name: Ensure SSH user exists and has SSH key
      ansible.builtin.user:
        name: "{{ ssh_user }}"
        group: "{{ ssh_user }}"
        home: "{{ ssh_key_home }}"
        create_home: true
        generate_ssh_key: true
        ssh_key_type: rsa
        ssh_key_bits: 4096
        ssh_key_file: "{{ ssh_key_file }}"
        ssh_key_comment: "{{ ssh_user }}@localhost"
        shell: /usr/sbin/nologin
    - name: Ensure SSH key home directory ownership and permissions
      ansible.builtin.file:
        path: "{{ ssh_key_home }}"
        state: directory
        owner: "{{ ssh_user }}"
        group: "{{ ssh_user }}"
        mode: '0700'
    - name: Check whether the SSH private key exists
      ansible.builtin.stat:
        path: "{{ ssh_key_path }}"
      register: ssh_private_key_stat
    - name: Assert that the SSH private key was generated
      ansible.builtin.assert:
        that:
        - ssh_private_key_stat.stat.exists
        fail_msg: "SSH private key was not generated at {{ ssh_key_path }}"
        success_msg: "SSH private key exists at {{ ssh_key_path }}"
    - name: Ensure SSH private key permissions
      ansible.builtin.file:
        path: "{{ ssh_key_path }}"
        state: file
        owner: "{{ ssh_user }}"
        group: "{{ ssh_user }}"
        mode: '0600'
      when: ssh_private_key_stat.stat.exists
    - name: Check whether the SSH public key exists
      ansible.builtin.stat:
        path: "{{ ssh_key_path }}.pub"
      register: ssh_public_key_stat
    - name: Ensure SSH public key permissions
      ansible.builtin.file:
        path: "{{ ssh_key_path }}.pub"
        state: file
        owner: "{{ ssh_user }}"
        group: "{{ ssh_user }}"
        mode: '0644'
      when: ssh_public_key_stat.stat.exists
    - name: Start and enable the SSH server service
      ansible.builtin.service:
        name: "{{ ssh_service_name }}"
        state: started
        enabled: true

