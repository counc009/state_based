---
- name: "Model qwen3.8-flash, Problem p20, Response 8"
  hosts: redhat,debian
  become: true
  vars:
    ssh_user: fizbaz
    ssh_key_path: /.ssh/fizbaz_rsa
    ssh_packages_by_family:
      Debian:
      - openssh-client
      - openssh-server
      RedHat:
      - openssh-clients
      - openssh-server
    ssh_service_by_family:
      Debian: ssh
      RedHat: sshd
  tasks:
  - name: Assert supported OS family
    ansible.builtin.assert:
      that:
      - "{{ ansible_facts['os_family'] in ssh_packages_by_family }}"
      fail_msg: "Only Debian and RedHat OS families are supported."
  - name: Install SSH client and server packages
    ansible.builtin.package:
      name: "{{ ssh_packages_by_family[ansible_facts['os_family']] }}"
      state: present
  - name: Start and enable SSH server service
    ansible.builtin.service:
      name: "{{ ssh_service_by_family[ansible_facts['os_family']] }}"
      state: started
      enabled: true
  - name: Ensure SSH user group exists
    ansible.builtin.group:
      name: "{{ ssh_user }}"
      state: present
  - name: Ensure SSH user exists
    ansible.builtin.user:
      name: "{{ ssh_user }}"
      group: "{{ ssh_user }}"
      create_home: false
  - name: Ensure /.ssh directory exists and is owned by fizbaz
    ansible.builtin.file:
      path: "{{ ssh_key_path | dirname }}"
      state: directory
      owner: "{{ ssh_user }}"
      group: "{{ ssh_user }}"
      mode: "0700"
  - name: Generate RSA SSH keypair for fizbaz
    community.crypto.openssh_keypair:
      path: "{{ ssh_key_path }}"
      type: RSA
      size: 4096
      comment: "{{ ssh_user }}"
      owner: "{{ ssh_user }}"
      group: "{{ ssh_user }}"
      mode: "0600"
      state: present
  - name: Check for public SSH key
    ansible.builtin.stat:
      path: "{{ ssh_key_path }}.pub"
    register: ssh_public_key_stat
  - name: Ensure public SSH key ownership and permissions
    ansible.builtin.file:
      path: "{{ ssh_key_path }}.pub"
      owner: "{{ ssh_user }}"
      group: "{{ ssh_user }}"
      mode: "0644"
      state: file
    when: ssh_public_key_stat.stat.exists

