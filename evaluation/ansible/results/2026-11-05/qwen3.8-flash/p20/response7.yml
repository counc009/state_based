---
- name: "Model qwen3.8-flash, Problem p20, Response 7"
  hosts: redhat,debian
  become: true
  vars:
    ssh_key_owner: fizbaz
    ssh_key_group: fizbaz
    ssh_key_path: /.ssh/fizbaz_rsa
    ssh_package_map:
      Debian:
      - openssh-client
      - openssh-server
      RedHat:
      - openssh-clients
      - openssh-server
    ssh_service_map:
      Debian: ssh
      RedHat: sshd
  tasks:
  - name: Install SSH client and server packages
    ansible.builtin.package:
      name: "{{ ssh_package_map[ansible_os_family] }}"
      state: present
    when: ansible_os_family in ssh_package_map
  - name: Start and enable SSH server
    ansible.builtin.service:
      name: "{{ ssh_service_map[ansible_os_family] }}"
      state: started
      enabled: true
    when: ansible_os_family in ssh_service_map
  - name: Ensure SSH key group exists
    ansible.builtin.group:
      name: "{{ ssh_key_group }}"
      state: present
    when: ansible_os_family in ssh_package_map
  - name: Ensure SSH key user exists
    ansible.builtin.user:
      name: "{{ ssh_key_owner }}"
      state: present
      create_home: false
    when: ansible_os_family in ssh_package_map
  - name: Ensure SSH key directory exists
    ansible.builtin.file:
      path: "/.ssh"
      state: directory
      owner: "{{ ssh_key_owner }}"
      group: "{{ ssh_key_group }}"
      mode: "0700"
    when: ansible_os_family in ssh_package_map
  - name: Generate SSH key pair for fizbaz
    community.crypto.openssh_keypair:
      path: "{{ ssh_key_path }}"
      type: rsa
      size: 4096
      state: present
    when: ansible_os_family in ssh_package_map
  - name: Ensure private SSH key ownership and permissions
    ansible.builtin.file:
      path: "{{ ssh_key_path }}"
      state: file
      owner: "{{ ssh_key_owner }}"
      group: "{{ ssh_key_group }}"
      mode: "0600"
    when: ansible_os_family in ssh_package_map

