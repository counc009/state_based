---
- name: "Model qwen3.8-flash, Problem p20, Response 9"
  hosts: redhat,debian
  become: true
  vars:
    ssh_user: fizbaz
    ssh_group: fizbaz
    ssh_key_directory: /.ssh
    ssh_key_path: /.ssh/fizbaz_rsa
    ssh_client_package: "{{ 'openssh-client' if ansible_os_family == 'Debian' else
      'openssh-clients' }}"
    ssh_server_package: openssh-server
    ssh_server_service: "{{ 'ssh' if ansible_os_family == 'Debian' else 'sshd' }}"
  tasks:
  - name: Install SSH client and server
    ansible.builtin.package:
      name:
      - "{{ ssh_client_package }}"
      - "{{ ssh_server_package }}"
      state: present
    when: ansible_os_family in ['Debian', 'RedHat']
  - name: Start and enable SSH server
    ansible.builtin.service:
      name: "{{ ssh_server_service }}"
      state: started
      enabled: true
    when: ansible_os_family in ['Debian', 'RedHat']
  - name: Ensure SSH key group exists
    ansible.builtin.group:
      name: "{{ ssh_group }}"
      state: present
    when: ansible_os_family in ['Debian', 'RedHat']
  - name: Ensure SSH key user exists
    ansible.builtin.user:
      name: "{{ ssh_user }}"
      group: "{{ ssh_group }}"
      home: "{{ ssh_key_directory }}"
      create_home: false
    when: ansible_os_family in ['Debian', 'RedHat']
  - name: Ensure SSH key directory exists
    ansible.builtin.file:
      path: "{{ ssh_key_directory }}"
      state: directory
      owner: "{{ ssh_user }}"
      group: "{{ ssh_group }}"
      mode: "0700"
    when: ansible_os_family in ['Debian', 'RedHat']
  - name: Generate SSH key for fizbaz
    community.crypto.openssh_keypair:
      path: "{{ ssh_key_path }}"
      state: present
      owner: "{{ ssh_user }}"
      group: "{{ ssh_group }}"
      mode: "0600"
    when: ansible_os_family in ['Debian', 'RedHat']

