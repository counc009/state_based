---
- name: "Model qwen3.8-flash, Problem p18, Response 8"
  hosts: redhat
  become: true
  vars:
    apache_package: httpd
    apache_service: httpd
    apache_docroot: /var/www/html
    apache_index_file: /var/www/html/index.html
    webdev_user: webdev
  tasks:
  - name: Install Apache HTTP server
    ansible.builtin.package:
      name: "{{ apache_package }}"
      state: present
    when: ansible_facts['os_family'] == 'RedHat'
  - name: Ensure Apache document root exists
    ansible.builtin.file:
      path: "{{ apache_docroot }}"
      state: directory
      owner: root
      group: root
      mode: '0755'
    when: ansible_facts['os_family'] == 'RedHat'
  - name: Ensure Apache home page exists
    ansible.builtin.copy:
      dest: "{{ apache_index_file }}"
      content: |
        <!doctype html>
        <html>
          <body>
            <h1>Apache Home Page</h1>
          </body>
        </html>
      force: false
      owner: root
      group: root
      mode: '0644'
    when: ansible_facts['os_family'] == 'RedHat'
  - name: Ensure Apache is started and enabled
    ansible.builtin.service:
      name: "{{ apache_service }}"
      state: started
      enabled: true
    when: ansible_facts['os_family'] == 'RedHat'
  - name: Create webdev user
    ansible.builtin.user:
      name: "{{ webdev_user }}"
      state: present
      create_home: true
    when: ansible_facts['os_family'] == 'RedHat'

