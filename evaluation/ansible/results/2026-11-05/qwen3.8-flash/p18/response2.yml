---
- name: "Model qwen3.8-flash, Problem p18, Response 2"
  hosts: redhat
  become: true
  vars:
    web_user: webdev
    web_group: webdev
    web_home: /var/www/html
    web_index: /var/www/html/index.html
    apache_package: httpd
    apache_service: httpd
  tasks:
  - name: Install Apache server
    ansible.builtin.package:
      name: "{{ apache_package }}"
      state: present
    when: ansible_facts['os_family'] == 'RedHat'
  - name: Create webdev group
    ansible.builtin.group:
      name: "{{ web_group }}"
      state: present
    when: ansible_facts['os_family'] == 'RedHat'
  - name: Create webdev user
    ansible.builtin.user:
      name: "{{ web_user }}"
      group: "{{ web_group }}"
      home: "/home/{{ web_user }}"
      create_home: true
      state: present
    when: ansible_facts['os_family'] == 'RedHat'
  - name: Ensure Apache home directory exists
    ansible.builtin.file:
      path: "{{ web_home }}"
      state: directory
      owner: root
      group: "{{ web_group }}"
      mode: "0755"
    when: ansible_facts['os_family'] == 'RedHat'
  - name: Ensure home page exists
    ansible.builtin.copy:
      dest: "{{ web_index }}"
      content: |
        <html>
          <head><title>Apache Server</title></head>
          <body><h1>Apache Server is working</h1></body>
        </html>
      owner: root
      group: "{{ web_group }}"
      mode: "0644"
      force: false
    when: ansible_facts['os_family'] == 'RedHat'
  - name: Ensure Apache is started and enabled
    ansible.builtin.service:
      name: "{{ apache_service }}"
      state: started
      enabled: true
    when: ansible_facts['os_family'] == 'RedHat'

