---
- name: "Model qwen3.8-flash, Problem p18, Response 9"
  hosts: redhat
  become: true
  tasks:
  - name: Perform RedHat-specific configuration
    when: ansible_facts['os_family'] == 'RedHat'
    block:
    - name: Install apache server
      ansible.builtin.package:
        name: httpd
        state: present
    - name: Ensure apache document root exists
      ansible.builtin.file:
        path: /var/www/html
        state: directory
        owner: root
        group: root
        mode: '0755'
    - name: Ensure apache home page exists
      ansible.builtin.file:
        path: /var/www/html/index.html
        state: touch
        owner: root
        group: root
        mode: '0644'
    - name: Create webdev user
      ansible.builtin.user:
        name: webdev
        state: present
        create_home: true

