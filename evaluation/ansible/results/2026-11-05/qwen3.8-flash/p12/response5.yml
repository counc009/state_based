---
- name: "Model qwen3.8-flash, Problem p12, Response 5"
  hosts: all
  become: true
  tasks:
  - name: Ensure destination directory exists
    ansible.builtin.file:
      path: /home/user
      state: directory
      mode: "0755"
  - name: Copy file to destination
    ansible.builtin.copy:
      src: /scratch/file.txt
      dest: /home/user/data.txt
      remote_src: true
      mode: preserve
      force: true
  - name: Remove source file
    ansible.builtin.file:
      path: /scratch/file.txt
      state: absent

