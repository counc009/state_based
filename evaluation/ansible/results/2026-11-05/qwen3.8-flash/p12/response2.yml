---
- name: "Model qwen3.8-flash, Problem p12, Response 2"
  hosts: all
  become: true
  tasks:
  - name: Check whether the source file exists
    ansible.builtin.stat:
      path: /scratch/file.txt
    register: source_file
  - name: Ensure destination directory exists
    ansible.builtin.file:
      path: /home/user
      state: directory
    when: source_file.stat.exists
  - name: Copy source file to destination
    ansible.builtin.copy:
      src: /scratch/file.txt
      dest: /home/user/data.txt
      remote_src: true
      mode: preserve
    when: source_file.stat.exists
  - name: Remove original file
    ansible.builtin.file:
      path: /scratch/file.txt
      state: absent

