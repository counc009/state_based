---
- name: "Model qwen3.8-flash, Problem p15, Response 10"
  hosts: all
  become: true
  tasks:
  - name: Find all contents of /home/mydata/web
    ansible.builtin.find:
      paths: /home/mydata/web
      recurse: true
      hidden: true
    register: web_directory_contents
  - name: Delete all files and directories inside /home/mydata/web
    ansible.builtin.file:
      path: "{{ item.path }}"
      state: absent
    loop: "{{ web_directory_contents.files | default([]) }}"
    loop_control:
      label: "{{ item.path }}"

