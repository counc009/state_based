---
- name: "Model qwen3.8-flash, Problem p13, Response 4"
  hosts: all
  become: true
  tasks:
  - name: Check if /etc/file.txt exists
    ansible.builtin.stat:
      path: /etc/file.txt
    register: file_result
  - name: Create /etc/file.txt with contents beginning if it does not exist
    ansible.builtin.copy:
      dest: /etc/file.txt
      content: beginning
    when: not file_result.stat.exists

