---
- name: "Model qwen3.8-flash, Problem p06, Response 10"
  hosts: all
  become: true
  vars:
    venv_path: /user/home/venv
    venv_parent: /user/home
    python_candidates:
    - /usr/bin/python3.10
    - /usr/local/bin/python3.10
    - /opt/homebrew/bin/python3.10
  tasks:
  - name: Check for Python 3.10 executables
    ansible.builtin.stat:
      path: "{{ item }}"
    loop: "{{ python_candidates }}"
    register: python3_10_check
  - name: Fail when Python 3.10 is not found
    ansible.builtin.fail:
      msg: >-
        Python 3.10 executable was not found among candidates: {{ python_candidates
        | join(', ') }}
    when: (python3_10_check.results | selectattr('stat.exists') | list | length) ==
      0
  - name: Set selected Python 3.10 executable
    ansible.builtin.set_fact:
      selected_python3_10: "{{ python3_10_check.results | selectattr('stat.exists')
        | map(attribute='item') | list | first }}"
  - name: Ensure virtualenv parent directory exists
    ansible.builtin.file:
      path: "{{ venv_parent }}"
      state: directory
      mode: "0755"
  - name: Create Python 3.10 virtual environment
    community.general.virtualenv:
      virtualenv: "{{ venv_path }}"
      virtualenv_command: "{{ selected_python3_10 }} -m venv"
      state: present
  - name: Check that the virtual environment Python executable exists
    ansible.builtin.stat:
      path: "{{ venv_path }}/bin/python3.10"
    register: venv_python_stat
  - name: Fail if the virtual environment Python executable is missing
    ansible.builtin.fail:
      msg: "The virtual environment Python executable is missing: {{ venv_path }}/bin/python3.10"
    when: not venv_python_stat.stat.exists
  - name: Install numpy into the virtual environment
    ansible.builtin.pip:
      name: numpy
      virtualenv: "{{ venv_path }}"
      executable: "{{ venv_path }}/bin/pip"
      state: present

