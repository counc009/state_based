---
- name: "Model qwen3.8-flash, Problem p06, Response 6"
  hosts: all
  become: true
  tasks:
  - name: Ensure parent directory for virtual environment exists
    ansible.builtin.file:
      path: /user/home
      state: directory
      mode: "0755"
  - name: Create Python 3.10 virtual environment and install numpy
    ansible.builtin.pip:
      name: numpy
      state: present
      virtualenv: /user/home/venv
      virtualenv_command: python3.10 -m venv

