---
- name: "Model qwen3.8-flash, Problem p17, Response 10"
  hosts: redhat,ubuntu
  become: true
  vars:
    postfix_package: postfix
    postfix_config_file: /etc/postfix/main.cf
    postfix_config_backup_file: /etc/postfix/main.cf.default.bak
    postfix_config_url_ubuntu: http://example.com/cfg.ubuntu
    postfix_config_url_redhat: http://example.com/cfg.redhat
  tasks:
  - name: Install latest postfix for RedHat
    ansible.builtin.package:
      name: "{{ postfix_package }}"
      state: latest
    when: ansible_facts['os_family'] == 'RedHat'
  - name: Install latest postfix for Ubuntu
    ansible.builtin.apt:
      name: "{{ postfix_package }}"
      state: latest
      update_cache: true
    when: ansible_facts['os_family'] == 'Debian'
  - name: Check default postfix configuration file
    ansible.builtin.stat:
      path: "{{ postfix_config_file }}"
    register: postfix_config_stat
  - name: Backup default postfix configuration file
    ansible.builtin.copy:
      src: "{{ postfix_config_file }}"
      dest: "{{ postfix_config_backup_file }}"
      remote_src: true
      owner: root
      group: root
      mode: '0644'
      force: false
    when: postfix_config_stat.stat.exists
  - name: Download postfix configuration file for RedHat
    ansible.builtin.get_url:
      url: "{{ postfix_config_url_redhat }}"
      dest: "{{ postfix_config_file }}"
      owner: root
      group: root
      mode: '0644'
    when: ansible_facts['os_family'] == 'RedHat'
    notify: restart postfix
  - name: Download postfix configuration file for Ubuntu
    ansible.builtin.get_url:
      url: "{{ postfix_config_url_ubuntu }}"
      dest: "{{ postfix_config_file }}"
      owner: root
      group: root
      mode: '0644'
    when: ansible_facts['os_family'] == 'Debian'
    notify: restart postfix
  handlers:
  - name: restart postfix
    ansible.builtin.service:
      name: postfix
      state: restarted

