---
- name: "Model qwen3.8-flash, Problem p17, Response 6"
  hosts: redhat,ubuntu
  become: true
  vars:
    postfix_conf: /etc/postfix/main.cf
  tasks:
  - name: Install latest postfix on Ubuntu
    ansible.builtin.apt:
      name: postfix
      state: latest
      update_cache: true
    when: ansible_facts['os_family'] == 'Debian'
  - name: Install latest postfix on RedHat with dnf
    ansible.builtin.dnf:
      name: postfix
      state: latest
      update_cache: true
    when:
    - ansible_facts['os_family'] == 'RedHat'
    - ansible_facts['pkg_mgr'] == 'dnf'
  - name: Install latest postfix on RedHat with yum
    ansible.builtin.yum:
      name: postfix
      state: latest
      update_cache: true
    when:
    - ansible_facts['os_family'] == 'RedHat'
    - ansible_facts['pkg_mgr'] == 'yum'
  - name: Check default postfix configuration file
    ansible.builtin.stat:
      path: "{{ postfix_conf }}"
    register: postfix_conf_stat
    when: ansible_facts['os_family'] in ['Debian', 'RedHat']
  - name: Backup default postfix configuration file
    ansible.builtin.copy:
      remote_src: true
      src: "{{ postfix_conf }}"
      dest: "{{ postfix_conf }}.bak"
      mode: preserve
    when:
    - postfix_conf_stat.stat.exists
    - ansible_facts['os_family'] in ['Debian', 'RedHat']
  - name: Download postfix configuration for Ubuntu
    ansible.builtin.get_url:
      url: http://example.com/cfg.ubuntu
      dest: "{{ postfix_conf }}"
      owner: root
      group: root
      mode: '0644'
    when: ansible_facts['os_family'] == 'Debian'
  - name: Download postfix configuration for RedHat
    ansible.builtin.get_url:
      url: http://example.com/cfg.redhat
      dest: "{{ postfix_conf }}"
      owner: root
      group: root
      mode: '0644'
    when: ansible_facts['os_family'] == 'RedHat'

