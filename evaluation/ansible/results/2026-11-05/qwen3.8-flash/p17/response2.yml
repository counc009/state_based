---
- name: "Model qwen3.8-flash, Problem p17, Response 2"
  hosts: redhat,ubuntu
  become: true
  vars:
    postfix_config_path: /etc/postfix/main.cf
    postfix_backup_path: /etc/postfix/main.cf.bak
  tasks:
  - name: Install latest postfix on Ubuntu
    ansible.builtin.apt:
      name: postfix
      state: latest
      update_cache: true
    when: ansible_facts['distribution'] == 'Ubuntu'
  - name: Install latest postfix on RedHat
    ansible.builtin.package:
      name: postfix
      state: latest
    when: ansible_facts['os_family'] == 'RedHat'
  - name: Check for default postfix configuration file
    ansible.builtin.stat:
      path: "{{ postfix_config_path }}"
    register: postfix_config_stat
  - name: Backup default postfix configuration file
    ansible.builtin.copy:
      src: "{{ postfix_config_path }}"
      dest: "{{ postfix_backup_path }}"
      remote_src: true
      owner: root
      group: root
      mode: "0644"
    when:
    - postfix_config_stat.stat.exists
    - postfix_config_stat.stat.isreg | default(false)
  - name: Download Ubuntu postfix configuration file
    ansible.builtin.get_url:
      url: "http://example.com/cfg.ubuntu"
      dest: "{{ postfix_config_path }}"
      owner: root
      group: root
      mode: "0644"
      force: true
    when: ansible_facts['distribution'] == 'Ubuntu'
  - name: Download RedHat postfix configuration file
    ansible.builtin.get_url:
      url: "http://example.com/cfg.redhat"
      dest: "{{ postfix_config_path }}"
      owner: root
      group: root
      mode: "0644"
      force: true
    when: ansible_facts['os_family'] == 'RedHat'

