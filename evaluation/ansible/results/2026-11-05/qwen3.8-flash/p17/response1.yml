---
- name: "Model qwen3.8-flash, Problem p17, Response 1"
  hosts: redhat,ubuntu
  become: true
  vars:
    postfix_config_file: /etc/postfix/main.cf
    postfix_config_backup_file: /etc/postfix/main.cf.bak
    postfix_config_urls:
      Debian: http://example.com/cfg.ubuntu
      RedHat: http://example.com/cfg.redhat
  tasks:
  - name: Install latest Postfix on Debian-family systems
    ansible.builtin.apt:
      name: postfix
      state: latest
      update_cache: true
    when: ansible_facts['os_family'] == 'Debian'
  - name: Install latest Postfix on RedHat-family systems
    ansible.builtin.package:
      name: postfix
      state: latest
    when: ansible_facts['os_family'] == 'RedHat'
  - name: Check whether the Postfix configuration file exists
    ansible.builtin.stat:
      path: "{{ postfix_config_file }}"
    register: postfix_config_stat
  - name: Check whether a backup of the Postfix configuration exists
    ansible.builtin.stat:
      path: "{{ postfix_config_backup_file }}"
    register: postfix_backup_stat
  - name: Back up the default Postfix configuration file
    ansible.builtin.copy:
      remote_src: true
      src: "{{ postfix_config_file }}"
      dest: "{{ postfix_config_backup_file }}"
      owner: root
      group: root
      mode: "0644"
    when:
    - postfix_config_stat.stat.exists
    - not postfix_backup_stat.stat.exists
  - name: Download distribution-specific Postfix configuration
    ansible.builtin.get_url:
      url: "{{ postfix_config_urls[ansible_facts['os_family']] }}"
      dest: "{{ postfix_config_file }}"
      owner: root
      group: root
      mode: "0644"
      backup: true
    when: ansible_facts['os_family'] in ['Debian', 'RedHat']

