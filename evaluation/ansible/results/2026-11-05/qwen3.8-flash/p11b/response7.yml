---
- name: "Model qwen3.8-flash, Problem p11b, Response 7"
  hosts: debian
  become: true
  tasks:
  - name: Ensure backup directory exists on the controller
    ansible.builtin.file:
      path: /backup
      state: directory
      mode: "0755"
    delegate_to: localhost
    run_once: true
  - name: Find .war files in /tmp
    ansible.builtin.find:
      paths: /tmp
      patterns: "*.war"
      file_type: file
    register: war_files
  - name: Fetch .war files from the remote machine to /backup on the controller
    ansible.builtin.fetch:
      src: "{{ item.path }}"
      dest: "/backup/{{ item.file }}"
      flat: true
    loop: "{{ war_files.files | default([]) }}"
    loop_control:
      label: "{{ item.path }}"

