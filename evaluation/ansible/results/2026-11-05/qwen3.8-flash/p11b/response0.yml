---
- name: "Model qwen3.8-flash, Problem p11b, Response 10"
  hosts: debian
  become: true
  tasks:
  - name: Ensure /backup directory exists on the controller
    ansible.builtin.file:
      path: /backup
      state: directory
      mode: "0755"
    delegate_to: localhost
    become: false
  - name: Find all .war files in /tmp on the remote machine
    ansible.builtin.find:
      paths: /tmp
      patterns:
      - "*.war"
      file_type: file
      recurse: false
      hidden: false
      follow: false
    register: war_files
  - name: Copy the found .war files from the remote machine to the controller
    ansible.builtin.fetch:
      src: "{{ item.path }}"
      dest: /backup/
      flat: true
    loop: "{{ war_files.files | default([]) }}"
    loop_control:
      label: "{{ item.path }}"

