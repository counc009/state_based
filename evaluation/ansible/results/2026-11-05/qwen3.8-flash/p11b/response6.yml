---
- name: "Model qwen3.8-flash, Problem p11b, Response 6"
  hosts: debian
  become: true
  tasks:
  - name: Ensure /backup directory exists on the controller
    ansible.builtin.file:
      path: /backup
      state: directory
    delegate_to: localhost
    run_once: true
  - name: Find all .war files in /tmp on the remote machine
    ansible.builtin.find:
      paths: /tmp
      patterns: "*.war"
      file_type: file
      recurse: false
    register: war_files
  - name: Copy each .war file from the remote machine to the controller
    ansible.builtin.fetch:
      src: "{{ item.path }}"
      dest: /backup
      flat: true
    loop: "{{ war_files.files }}"
    loop_control:
      label: "{{ item.path }}"

