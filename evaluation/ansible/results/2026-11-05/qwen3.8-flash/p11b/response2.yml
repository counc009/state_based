---
- name: "Model qwen3.8-flash, Problem p11b, Response 2"
  hosts: debian
  become: true
  tasks:
  - name: Ensure /backup directory exists on the controller
    ansible.builtin.file:
      path: /backup
      state: directory
      mode: "0755"
    delegate_to: localhost
    connection: local
  - name: Find .war files in /tmp on the remote machine
    ansible.builtin.find:
      paths: /tmp
      patterns:
      - "*.war"
      file_type: file
      recurse: false
    register: war_files
  - name: Copy .war files to /backup on the controller
    ansible.builtin.fetch:
      src: "{{ item.path }}"
      dest: /backup/
      flat: true
    loop: "{{ war_files.files }}"
    loop_control:
      label: "{{ item.path }}"

