---
- name: "Model qwen3.8-flash, Problem p14, Response 7"
  hosts: debian
  become: true
  tasks:
  - name: Check if Debian reports that a reboot is required
    ansible.builtin.stat:
      path: /var/run/reboot-required
    register: debian_reboot_required
  - name: Reboot Debian system if reboot is required
    ansible.builtin.reboot:
      msg: "Rebooting because Debian reports a reboot is required"
      reboot_timeout: 600
      timeout: 600
    when:
    - ansible_facts['os_family'] == 'Debian'
    - debian_reboot_required.stat.exists

