---
- name: "Model qwen3.8-flash, Problem p19, Response 5"
  hosts: all
  become: true
  vars:
    wheel_group: wheel
    ansible_account: ansible
  tasks:
  - name: Ensure wheel group exists
    ansible.builtin.group:
      name: "{{ wheel_group }}"
      state: present
  - name: Ensure sudoers.d directory exists
    ansible.builtin.file:
      path: /etc/sudoers.d
      state: directory
      owner: root
      group: root
      mode: "0750"
  - name: Allow passwordless sudo for wheel group
    ansible.builtin.copy:
      dest: /etc/sudoers.d/wheel
      content: |
        %{{ wheel_group }} ALL=(ALL) NOPASSWD: ALL
      owner: root
      group: root
      mode: "0440"
  - name: Create ansible user and add it to the wheel group
    ansible.builtin.user:
      name: "{{ ansible_account }}"
      groups: "{{ wheel_group }}"
      append: true
      create_home: true

