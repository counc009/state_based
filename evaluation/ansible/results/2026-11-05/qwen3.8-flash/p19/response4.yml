---
- name: "Model qwen3.8-flash, Problem p19, Response 4"
  hosts: all
  become: true
  tasks:
  - name: Ensure wheel group exists
    ansible.builtin.group:
      name: wheel
      state: present
  - name: Create ansible user and add to wheel group
    ansible.builtin.user:
      name: ansible
      groups: wheel
      append: true
      shell: /bin/bash
      state: present
  - name: Enable passwordless sudo for the wheel group
    ansible.builtin.lineinfile:
      path: /etc/sudoers
      regexp: '^%wheel\s+ALL=\(ALL\).*NOPASSWD:'
      line: '%wheel ALL=(ALL) NOPASSWD: ALL'
      state: present
      owner: root
      group: root
      mode: "0440"
      backup: true

