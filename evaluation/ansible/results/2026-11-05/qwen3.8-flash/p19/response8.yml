---
- name: "Model qwen3.8-flash, Problem p19, Response 8"
  hosts: all
  become: true
  tasks:
  - name: Ensure wheel group exists
    ansible.builtin.group:
      name: wheel
      state: present
  - name: Create ansible user and add it to the wheel group
    ansible.builtin.user:
      name: ansible
      groups: wheel
      append: true
      create_home: true
      shell: /bin/bash
  - name: Enable passwordless sudo for the wheel group
    ansible.builtin.copy:
      dest: /etc/sudoers.d/wheel
      owner: root
      group: root
      mode: "0440"
      content: "%wheel ALL=(ALL) NOPASSWD: ALL\n"

