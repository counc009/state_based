---
- name: "Model qwen3.8-flash, Problem p19, Response 7"
  hosts: all
  become: true
  vars:
    sudo_group: wheel
    ansible_login_user: ansible
  tasks:
  - name: Ensure {{ sudo_group }} group exists
    ansible.builtin.group:
      name: "{{ sudo_group }}"
      system: true
      state: present
  - name: Ensure /etc/sudoers.d directory exists
    ansible.builtin.file:
      path: /etc/sudoers.d
      state: directory
      mode: "0750"
  - name: Enable passwordless sudo for {{ sudo_group }} group
    ansible.builtin.copy:
      dest: /etc/sudoers.d/wheel
      content: |
        %{{ sudo_group }} ALL=(ALL) NOPASSWD: ALL
      mode: "0440"
      owner: root
      group: root
  - name: Create and manage ansible user with wheel group membership
    ansible.builtin.user:
      name: "{{ ansible_login_user }}"
      groups: "{{ sudo_group }}"
      append: true
      create_home: true
      state: present

