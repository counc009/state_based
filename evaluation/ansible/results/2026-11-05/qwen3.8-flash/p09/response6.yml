---
- name: "Model qwen3.8-flash, Problem p09, Response 6"
  hosts: all
  become: true
  tasks:
  - name: Ensure module load gcc line is present at the end of foo's bashrc
    ansible.builtin.lineinfile:
      path: /home/foo/.bashrc
      line: 'module load gcc'
      insertafter: EOF
      create: true
      state: present

