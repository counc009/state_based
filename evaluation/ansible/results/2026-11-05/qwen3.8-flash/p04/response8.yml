---
- name: "Model qwen3.8-flash, Problem p04, Response 8"
  hosts: all
  become: true
  tasks:
  - name: Ensure the top-level directory has the correct permissions
    ansible.builtin.file:
      path: /srv/path
      state: directory
      mode: "0755"
  - name: Find all directories under /srv/path
    ansible.builtin.find:
      paths:
      - /srv/path
      patterns: "*"
      recurse: true
      hidden: true
      file_type: directory
    register: srv_path_directories
  - name: Set directory permissions to owner-writable only
    ansible.builtin.file:
      path: "{{ item.path }}"
      state: directory
      mode: "0755"
    loop: "{{ srv_path_directories.files }}"
    loop_control:
      label: "{{ item.path }}"
  - name: Find all regular files under /srv/path
    ansible.builtin.find:
      paths:
      - /srv/path
      patterns: "*"
      recurse: true
      hidden: true
      file_type: file
    register: srv_path_files
  - name: Set file permissions to owner-writable only
    ansible.builtin.file:
      path: "{{ item.path }}"
      state: file
      mode: "0644"
    loop: "{{ srv_path_files.files }}"
    loop_control:
      label: "{{ item.path }}"

