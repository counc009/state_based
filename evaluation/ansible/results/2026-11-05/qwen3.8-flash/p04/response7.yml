---
- name: "Model qwen3.8-flash, Problem p04, Response 7"
  hosts: all
  become: true
  tasks:
  - name: Ensure /srv/path exists with correct permissions
    ansible.builtin.file:
      path: /srv/path
      state: directory
      mode: '0755'
  - name: Find regular files under /srv/path
    ansible.builtin.find:
      paths: /srv/path
      recurse: true
      follow: false
      file_type: file
    register: files_under_srv_path
  - name: Find directories under /srv/path
    ansible.builtin.find:
      paths: /srv/path
      recurse: true
      follow: false
      file_type: directory
    register: directories_under_srv_path
  - name: Set file permissions to owner write, all users read
    ansible.builtin.file:
      path: "{{ item.path }}"
      state: file
      follow: false
      mode: '0644'
    loop: "{{ files_under_srv_path.files }}"
  - name: Set directory permissions to owner write, all users list/read/traverse
    ansible.builtin.file:
      path: "{{ item.path }}"
      state: directory
      follow: false
      mode: '0755'
    loop: "{{ directories_under_srv_path.files }}"

